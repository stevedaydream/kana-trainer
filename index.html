<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>五十音練習器</title>
<meta name="description" content="翻牌提取練習 × 錯題加權 × 十級解鎖的五十音練習器">
<meta name="theme-color" content="#1f4788">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="img/icon-192.png">
<style>
:root{
  --ruri:#1f4788;      /* 瑠璃紺 */
  --ruri-light:#3a6bb5;
  --shu:#eb6101;       /* 朱色 */
  --sumi:#2b2b2b;      /* 墨色 */
  --paper:#f7f4ec;
  --card:#fffdf7;
  --line:#d8d2c4;
  --ok:#2e7d32;
  --ng:#c62828;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:16px}
body{
  font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Noto Sans TC","Yu Gothic","Microsoft JhengHei",sans-serif;
  background:var(--paper);color:var(--sumi);min-height:100vh;
}
#app{max-width:520px;margin:0 auto;padding:16px 16px 48px}
h1{font-size:1.5rem;color:var(--ruri);letter-spacing:.1em}
.sub{color:#8a8272;font-size:.85rem;margin-top:4px}
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
button{
  font-family:inherit;font-size:1rem;border:none;border-radius:10px;
  padding:12px 16px;cursor:pointer;background:var(--ruri);color:#fff;
  transition:transform .06s, opacity .2s;
}
button:active{transform:scale(.97)}
button.ghost{background:transparent;color:var(--ruri);border:1.5px solid var(--ruri)}
button.shu{background:var(--shu)}
button.small{font-size:.85rem;padding:8px 12px;border-radius:8px}
button:disabled{opacity:.45;cursor:default}
.banner{
  background:#fff6e8;border:1px solid #f0d9b0;border-radius:10px;
  padding:10px 12px;font-size:.85rem;color:#8a6d3b;margin-bottom:14px;
}
.banner.err{background:#fdecea;border-color:#f2b8b5;color:var(--ng)}
/* ---- 級別列表 ---- */
.levels{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.level-row{
  display:flex;align-items:center;gap:12px;background:var(--card);
  border:1px solid var(--line);border-radius:12px;padding:14px;
  cursor:pointer;box-shadow:0 1px 3px rgba(43,43,43,.06);
}
.level-row.locked{opacity:.55;cursor:default}
.level-row .badge{
  width:44px;height:44px;border-radius:10px;display:flex;align-items:center;justify-content:center;
  background:var(--ruri);color:#fff;font-weight:bold;font-size:1.1rem;flex-shrink:0;
}
.level-row.locked .badge{background:#a9a292}
.level-row .info{flex:1}
.level-row .name{font-weight:600}
.level-row .meta{font-size:.78rem;color:#8a8272;margin-top:2px}
.level-row .score{font-size:.85rem;color:var(--shu);font-weight:600;white-space:nowrap}
/* ---- 弱項榜 ---- */
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:20px}
.panel h2{font-size:1rem;color:var(--ruri);margin-bottom:10px}
.weak-list{display:flex;flex-wrap:wrap;gap:8px}
.weak-chip{
  display:inline-flex;align-items:center;gap:6px;background:#fdf0e6;border:1px solid #f3cdae;
  border-radius:999px;padding:6px 12px;font-size:1rem;
}
.weak-chip b{color:var(--shu);font-size:.78rem}
/* ---- 田字格卡片 ---- */
.card-stage{display:flex;flex-direction:column;align-items:center;gap:16px;margin-top:8px}
.tazuke{
  position:relative;width:min(78vw,300px);height:min(78vw,300px);
  background:var(--card);border:2px solid var(--ruri);border-radius:14px;
  display:flex;align-items:center;justify-content:center;cursor:pointer;
  box-shadow:0 3px 10px rgba(31,71,136,.12);user-select:none;
}
.tazuke::before,.tazuke::after{
  content:"";position:absolute;background:transparent;pointer-events:none;
}
.tazuke::before{left:50%;top:6%;bottom:6%;border-left:1.5px dashed #c9d4e6}
.tazuke::after{top:50%;left:6%;right:6%;border-top:1.5px dashed #c9d4e6}
.kana-big{font-size:104px;color:var(--sumi);line-height:1;z-index:1}
.kana-big.multi{font-size:64px}
.tap-hint{position:absolute;bottom:10px;left:0;right:0;text-align:center;font-size:.75rem;color:#a9a292}
/* ---- 揭曉面 ---- */
.reveal{width:min(78vw,300px);background:var(--card);border:2px solid var(--shu);border-radius:14px;padding:16px;text-align:center}
.reveal .romaji{font-size:2rem;color:var(--shu);font-weight:700;letter-spacing:.05em}
.reveal .kana-mid{font-size:2.6rem;margin-top:2px}
.reveal .origin{font-size:.85rem;color:var(--ruri);margin-top:8px;line-height:1.5}
.reveal .visual{margin:10px auto;width:96px;height:96px;display:flex;align-items:center;justify-content:center}
.reveal .visual img,.reveal .visual svg{max-width:96px;max-height:96px}
.reveal .visual .emoji{font-size:64px;line-height:1}
.reveal .word{font-size:1.1rem;margin-top:4px}
.reveal .zh{font-size:.85rem;color:#8a8272;margin-top:2px}
.grade-btns{display:flex;gap:14px;margin-top:4px}
.grade-btns button{min-width:120px}
.progress-note{font-size:.8rem;color:#8a8272}
/* ---- 考試 ---- */
.exam-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.exam-score{font-weight:700;color:var(--ruri)}
.timerbar{height:8px;background:#e5dfd2;border-radius:4px;overflow:hidden;margin-bottom:18px}
.timerbar i{display:block;height:100%;background:var(--shu);border-radius:4px;transition:width .3s linear}
.q-prompt{
  background:var(--card);border:2px solid var(--ruri);border-radius:14px;
  min-height:130px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:8px;padding:16px;margin-bottom:16px;text-align:center;
}
.q-prompt .k{font-size:72px;line-height:1.1}
.q-prompt .k.multi{font-size:48px}
.q-prompt .label{font-size:.85rem;color:#8a8272}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opts button{
  background:var(--card);color:var(--sumi);border:1.5px solid var(--line);
  font-size:1.5rem;padding:16px 8px;border-radius:12px;
}
.opts button.hit{background:#e6f4e6;border-color:var(--ok);color:var(--ok)}
.opts button.miss{background:#fdecea;border-color:var(--ng);color:var(--ng)}
.replay-btn{margin:0 auto}
/* ---- 結果 ---- */
.result-box{text-align:center;padding:28px 0}
.result-box .big{font-size:3rem;font-weight:700;color:var(--ruri)}
.result-box .msg{margin-top:10px;font-size:1.05rem}
.result-box .unlock{color:var(--shu);font-weight:700;margin-top:8px}
.btn-col{display:flex;flex-direction:column;gap:10px;margin-top:24px;align-items:center}
.btn-col button{min-width:220px}
/* ---- 級別頁 ---- */
.part-list{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.part-list button{display:flex;justify-content:space-between;align-items:center;background:var(--card);color:var(--sumi);border:1.5px solid var(--line);padding:15px;font-size:1rem}
.part-list button .tag{font-size:.78rem;color:#fff;background:var(--ruri);border-radius:6px;padding:2px 8px}
.part-list button.exam .tag{background:var(--shu)}
.check-row{display:flex;align-items:center;gap:8px;margin-top:16px;font-size:.9rem;color:#5c5647}
.check-row input{width:18px;height:18px;accent-color:var(--shu)}
/* ---- 熱身 ---- */
.warm-grid{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:18px 0}
.warm-grid span{
  width:56px;height:56px;display:flex;align-items:center;justify-content:center;
  background:var(--card);border:1.5px solid var(--line);border-radius:10px;font-size:1.6rem;
  transition:all .15s;
}
.warm-grid span.now{background:var(--ruri);color:#fff;border-color:var(--ruri);transform:scale(1.15)}
.center{text-align:center}
a{color:var(--ruri)}
/* ---- 每日 / 連續天數 ---- */
.streak{background:#fdf0e6;border:1px solid #f3cdae;color:var(--shu);font-weight:700;border-radius:999px;padding:6px 12px;font-size:.9rem;white-space:nowrap}
.goalbar{position:relative;height:20px;background:#e5dfd2;border-radius:10px;overflow:hidden;margin-bottom:14px}
.goalbar i{display:block;height:100%;background:linear-gradient(90deg,var(--ruri),var(--ruri-light));border-radius:10px;transition:width .4s}
.goalbar span{position:absolute;inset:0;text-align:center;font-size:.72rem;line-height:20px;color:var(--sumi)}
.banner.due{background:#eef4ff;border-color:#c3d4ef;color:var(--ruri)}
/* ---- 首頁行動入口 ---- */
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:4px 0 6px}
.act{display:flex;flex-direction:column;align-items:flex-start;gap:2px;background:var(--card);color:var(--sumi);border:1.5px solid var(--line);font-size:.95rem;padding:14px;text-align:left}
.act.primary{grid-column:1 / -1;background:var(--ruri);color:#fff;border-color:var(--ruri);flex-direction:row;justify-content:space-between;align-items:center;font-size:1.05rem;font-weight:600}
.act.primary:disabled{background:#a9a292;border-color:#a9a292}
.act .cnt{font-size:.85rem;opacity:.9;font-weight:400}
/* ---- 設定頁（分段選擇） ---- */
.setup{margin-top:8px}
.setlabel{font-size:.85rem;color:#8a8272;margin:14px 0 6px}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg button{background:var(--card);color:var(--sumi);border:1.5px solid var(--line);font-size:.9rem;padding:10px 14px;border-radius:10px;flex:1 1 auto}
.seg button.on{background:var(--ruri);color:#fff;border-color:var(--ruri)}
.start{font-size:1.05rem}
/* ---- 課後總結 ---- */
.summary{max-width:300px;margin:18px auto 0;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 16px;text-align:left}
.summary .srow{display:flex;justify-content:space-between;font-size:.9rem;padding:4px 0;border-bottom:1px dashed #ece6d8}
.summary .srow:last-child{border-bottom:none}
.summary .srow b{color:var(--ruri)}
/* ---- 產出型輸入 ---- */
.typebox{display:flex;gap:10px}
.typebox input{flex:1;font-family:inherit;font-size:1.3rem;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);color:var(--sumi);text-align:center}
.typebox input:focus{outline:none;border-color:var(--ruri)}
.typebox input.wrong{border-color:var(--ng);color:var(--ng)}
.linkbtn{background:none;border:none;color:var(--ruri);text-decoration:underline;font-size:.85rem;padding:6px;margin-top:6px}
</style>
</head>
<body>
<div id="app"></div>
<script src="data/levels.js"></script>
<script>
"use strict";
/* =====================================================================
 * 五十音練習器 主程式
 * 只透過 window.KANA_DATA 取資料；題庫更換零修改。
 * =================================================================== */
(function () {
  const $app = document.getElementById("app");
  const params = new URLSearchParams(location.search);

  /* ---------- 題庫載入防護 ---------- */
  const DATA = (window.KANA_DATA && Array.isArray(window.KANA_DATA.levels) && window.KANA_DATA.levels.length)
    ? window.KANA_DATA : null;
  if (!DATA) {
    $app.innerHTML =
      '<div class="topbar"><div><h1>五十音練習器</h1></div></div>' +
      '<div class="banner err"><b>題庫未載入</b><br>' +
      '找不到 <code>data/levels.js</code> 或其中沒有 <code>window.KANA_DATA</code>。<br>' +
      '請確認檔案存在後重新整理頁面。</div>';
    return;
  }
  const LEVELS = DATA.levels;
  const ALL_KANA = [];
  const BY_K = {};
  LEVELS.forEach(lv => (lv.hira.concat(lv.kata)).forEach(x => { ALL_KANA.push(x); BY_K[x.k] = x; }));

  /* ---------- 儲存層：window.storage → localStorage → 記憶體 ---------- */
  const STORE_KEY = "kana_trainer_v1";
  const store = (function () {
    try {
      if (window.storage && typeof window.storage.getItem === "function" && typeof window.storage.setItem === "function") {
        return {
          kind: "claude",
          async get() { try { const v = await window.storage.getItem(STORE_KEY); return v ? JSON.parse(typeof v === "string" ? v : v.value) : null; } catch (e) { return null; } },
          set(obj) { try { window.storage.setItem(STORE_KEY, JSON.stringify(obj)); } catch (e) {} }
        };
      }
    } catch (e) {}
    try {
      const t = "__kt_test__";
      window.localStorage.setItem(t, "1"); window.localStorage.removeItem(t);
      return {
        kind: "local",
        async get() { try { const v = window.localStorage.getItem(STORE_KEY); return v ? JSON.parse(v) : null; } catch (e) { return null; } },
        set(obj) { try { window.localStorage.setItem(STORE_KEY, JSON.stringify(obj)); } catch (e) {} }
      };
    } catch (e) {}
    let mem = null;
    return { kind: "memory", async get() { return mem; }, set(obj) { mem = obj; } };
  })();

  /* ---------- 進度狀態 ---------- */
  const DAY = 86400000;
  // FSRS-lite：DSR 模型（難度/穩定度/可提取度），目標留存 90%；不做梯度下降，208 音規模足夠。
  const FSRS = { G: 3, S0: { 1: 0.5, 3: 2, 4: 4 }, MASTER_S: 21 };
  const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
  const P = {
    weights: {}, streak: {}, best: {}, unlocked: 1, warmup: false,
    srs: {}, daily: { lastActiveDate: "", streakDays: 0, todayCount: 0, goal: 30 }
  };
  function initKeys() {
    ALL_KANA.forEach(x => {
      if (!(x.k in P.weights)) P.weights[x.k] = 1;   // 新假名自動補 1
      if (!(x.k in P.streak)) P.streak[x.k] = 0;
      if (!(x.k in P.srs)) P.srs[x.k] = { D: 5, S: 0, last: 0, reps: 0, lapses: 0 };
    });
  }
  function save() {
    store.set({ weights: P.weights, streak: P.streak, best: P.best, unlocked: P.unlocked,
      warmup: P.warmup, srs: P.srs, daily: P.daily });
  }

  /* ----- FSRS-lite 間隔重複排程 ----- */
  function srsUpdate(k, rating) {   // rating: 1=Again(✗) / 3=Good(✓) / 4=Easy
    const now = Date.now();
    const s = P.srs[k] || (P.srs[k] = { D: 5, S: 0, last: 0, reps: 0, lapses: 0 });
    if (s.reps === 0) {
      s.D = clamp(6 - (rating - 3), 1, 10);
      s.S = FSRS.S0[rating] || FSRS.S0[3];
    } else {
      const elapsed = (now - s.last) / DAY;
      const R = Math.exp(Math.log(0.9) * elapsed / Math.max(s.S, 0.01)); // 可提取度
      if (rating === 1) { s.S = Math.max(0.2, s.S * 0.3); s.D = clamp(s.D + 1, 1, 10); s.lapses++; }
      else { s.S = s.S * (1 + FSRS.G * (1 - R) * (11 - s.D) / 10); s.D = clamp(s.D - 0.3, 1, 10); } // R 越低成長越大＝合宜困難度
    }
    s.last = now;
    // 失敗（Again）當日重練：due 設為現在，立即回到今日複習佇列；成功則依穩定度排程
    s.due = rating === 1 ? now : now + s.S * DAY;
    s.reps++;
  }
  function dueOf(k) {
    const s = P.srs[k];
    if (!s || s.reps === 0) return Infinity;
    return s.due != null ? s.due : s.last + s.S * DAY;  // 舊存檔無 due 時回退
  }
  function isMastered(k) { const s = P.srs[k]; return !!(s && s.S >= FSRS.MASTER_S); }
  function masteredCount() { return ALL_KANA.reduce((n, x) => n + (isMastered(x.k) ? 1 : 0), 0); }

  /* ----- 每日目標 / 連續天數（呼應 24 小時鞏固循環） ----- */
  function dayKey(ts) {
    const d = new Date(ts), m = String(d.getMonth() + 1).padStart(2, "0"), dd = String(d.getDate()).padStart(2, "0");
    return d.getFullYear() + "-" + m + "-" + dd;
  }
  function bumpDaily() {
    const t = dayKey(Date.now());
    if (P.daily.lastActiveDate !== t) {
      const prev = P.daily.lastActiveDate;
      const gap = prev ? Math.round((Date.parse(t) - Date.parse(prev)) / DAY) : Infinity;
      P.daily.streakDays = gap === 1 ? (P.daily.streakDays || 0) + 1 : 1;
      P.daily.lastActiveDate = t;
      P.daily.todayCount = 0;
    }
    P.daily.todayCount++;
  }

  function markMiss(k) {
    P.weights[k] = Math.min(16, (P.weights[k] || 1) * 4); P.streak[k] = 0;
    srsUpdate(k, 1); bumpDaily(); save();
  }
  function markHit(k, easy) {
    P.streak[k] = (P.streak[k] || 0) + 1;
    P.weights[k] = P.streak[k] >= 2 ? 1 : Math.max(1, (P.weights[k] || 1) / 2);
    srsUpdate(k, easy ? 4 : 3); bumpDaily(); save();
  }

  /* ---------- 語音（無 speechSynthesis 時靜音降級，絕不拋錯） ---------- */
  const TTS = (function () {
    let ok = false;
    try { ok = !params.has("notts") && "speechSynthesis" in window && typeof window.SpeechSynthesisUtterance === "function"; } catch (e) { ok = false; }
    let voice = null;
    function pickVoice() {
      try {
        const vs = window.speechSynthesis.getVoices() || [];
        voice = vs.find(v => /^ja/i.test(v.lang)) || null;
      } catch (e) {}
    }
    if (ok) {
      pickVoice();
      try { window.speechSynthesis.onvoiceschanged = pickVoice; } catch (e) {}
    }
    return {
      enabled: ok,
      speak(text, rate) {
        if (!ok || !text) return;
        try {
          window.speechSynthesis.cancel();
          const u = new SpeechSynthesisUtterance(text);
          u.lang = "ja-JP";
          if (voice) u.voice = voice;
          u.rate = rate || 0.85;
          window.speechSynthesis.speak(u);
        } catch (e) {}
      },
      stop() { if (ok) { try { window.speechSynthesis.cancel(); } catch (e) {} } }
    };
  })();
  const speakable = w => String(w || "").replace(/（[^）]*）/g, "");

  /* ---------- 內建 SVG（程式資產；缺 SVG 退 emoji） ---------- */
  const SVGS = {
    asa: '<svg viewBox="0 0 96 96"><rect x="8" y="60" width="80" height="6" fill="#1f4788"/><circle cx="48" cy="58" r="20" fill="#eb6101"/><g stroke="#eb6101" stroke-width="4" stroke-linecap="round"><line x1="48" y1="22" x2="48" y2="10"/><line x1="22" y1="34" x2="14" y2="26"/><line x1="74" y1="34" x2="82" y2="26"/></g></svg>',
    inu: '<svg viewBox="0 0 96 96"><ellipse cx="48" cy="62" rx="26" ry="20" fill="#c8905c"/><circle cx="48" cy="36" r="18" fill="#c8905c"/><ellipse cx="34" cy="22" rx="7" ry="12" fill="#8a5a30"/><ellipse cx="62" cy="22" rx="7" ry="12" fill="#8a5a30"/><circle cx="42" cy="34" r="2.5" fill="#2b2b2b"/><circle cx="54" cy="34" r="2.5" fill="#2b2b2b"/><ellipse cx="48" cy="42" rx="4" ry="3" fill="#2b2b2b"/></svg>',
    umi: '<svg viewBox="0 0 96 96"><path d="M4 58 Q16 44 28 58 T52 58 T76 58 T96 58 V88 H4 Z" fill="#3a6bb5"/><path d="M4 70 Q16 58 28 70 T52 70 T76 70 T96 70 V92 H4 Z" fill="#1f4788"/><circle cx="72" cy="26" r="10" fill="#eb6101"/></svg>',
    eki: '<svg viewBox="0 0 96 96"><rect x="14" y="38" width="68" height="34" rx="4" fill="#1f4788"/><rect x="22" y="46" width="14" height="12" fill="#fffdf7"/><rect x="60" y="46" width="14" height="12" fill="#fffdf7"/><rect x="10" y="72" width="76" height="6" fill="#2b2b2b"/><path d="M14 38 L48 18 L82 38 Z" fill="#eb6101"/></svg>',
    onigiri: '<svg viewBox="0 0 96 96"><path d="M48 14 Q60 14 74 42 Q84 62 76 72 Q66 80 48 80 Q30 80 20 72 Q12 62 22 42 Q36 14 48 14 Z" fill="#fffdf7" stroke="#d8d2c4" stroke-width="2"/><rect x="36" y="56" width="24" height="22" rx="3" fill="#2b2b2b"/></svg>',
    aisu: '<svg viewBox="0 0 96 96"><path d="M30 44 L48 88 L66 44 Z" fill="#c8905c"/><circle cx="48" cy="34" r="18" fill="#fde8ef"/><circle cx="36" cy="40" r="10" fill="#fbd0de"/><circle cx="60" cy="40" r="10" fill="#fbd0de"/></svg>',
    inku: '<svg viewBox="0 0 96 96"><rect x="30" y="40" width="36" height="36" rx="6" fill="#1f4788"/><rect x="38" y="28" width="20" height="12" rx="2" fill="#2b2b2b"/><path d="M70 20 L78 28 L58 48 L50 48 L50 40 Z" fill="#eb6101"/></svg>',

  };

  /* 圖片載入優先序：img/{key}.png → 內建 SVG → emoji */
  function visualEl(x) {
    const box = document.createElement("div");
    box.className = "visual";
    const fallback = () => {
      if (SVGS[x.img]) box.innerHTML = SVGS[x.img];
      else box.innerHTML = '<span class="emoji">' + (x.emoji || "❔") + "</span>";
    };
    const im = new Image();
    im.alt = x.zh || "";
    im.onload = () => { box.innerHTML = ""; box.appendChild(im); };
    im.onerror = fallback;
    im.src = "img/" + x.img + ".png";
    fallback(); // 先放退回內容，圖檔載到再替換
    return box;
  }

  /* ---------- 工具 ---------- */
  const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  function weightedPick(set, excludeK) {
    let pool = set.filter(x => x.k !== excludeK);
    if (!pool.length) pool = set;
    let total = 0;
    const cum = pool.map(x => (total += (P.weights[x.k] || 1)));
    const r = Math.random() * total;
    for (let i = 0; i < pool.length; i++) if (r < cum[i]) return pool[i];
    return pool[pool.length - 1];
  }
  function kanaSizeClass(k) { return k.length > 1 ? "kana-big multi" : "kana-big"; }
  function unlockedLevels() { return LEVELS.filter(lv => lv.id <= P.unlocked); }
  function unlockedKana() { const out = []; unlockedLevels().forEach(lv => out.push(...lv.hira, ...lv.kata)); return out; }
  function rangeKana(loId, hiId, kinds) {   // kinds: "hira" | "kata" | "both"
    const out = [];
    LEVELS.forEach(lv => {
      if (lv.id < loId || lv.id > hiId) return;
      if (kinds !== "kata") out.push(...lv.hira);
      if (kinds !== "hira") out.push(...lv.kata);
    });
    return out;
  }
  function reviewQueue() {   // 已解鎖範圍內到期複習，依最該複習優先，上限 40（CLT 保護工作記憶）
    const now = Date.now();
    return unlockedKana().filter(x => dueOf(x.k) <= now)
      .sort((a, b) => dueOf(a.k) - dueOf(b.k)).slice(0, 40);
  }
  function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }

  /* ----- 易混淆假名（Noticing the Gap）：程式資產，非題庫 ----- */
  const CONFUSE_GROUPS = [
    ["シ", "ツ", "ソ", "ン"], ["ね", "れ", "わ"], ["は", "ほ", "ま", "も"], ["る", "ろ"],
    ["ク", "ワ", "タ", "ケ", "フ"], ["コ", "ユ", "ヨ"], ["ぬ", "め", "れ"], ["あ", "お"],
    ["き", "さ", "ち"], ["ウ", "ワ", "ヲ", "ラ"], ["ナ", "メ", "ヌ", "ス"], ["ア", "マ"]
  ];
  const CONFUSABLES = {};
  CONFUSE_GROUPS.forEach(g => g.forEach(k => { CONFUSABLES[k] = (CONFUSABLES[k] || []).concat(g.filter(o => o !== k)); }));
  function confusablePool(pool, correctK) {   // pool 中與正解形近者，供考試優先干擾
    const set = CONFUSABLES[correctK]; if (!set) return null;
    const hit = pool.filter(o => set.indexOf(o.k) >= 0);
    return hit.length ? hit : null;
  }
  function distractors(pool, correct, n, key, priorityPool) {
    const c = key(correct);
    let cand = priorityPool ? shuffle([...new Set(priorityPool.map(key))].filter(v => v !== c)) : [];
    const rest = shuffle([...new Set(pool.map(key))].filter(v => v !== c && cand.indexOf(v) < 0));
    cand = cand.concat(rest).slice(0, n);
    return shuffle(cand.concat([c]));
  }

  /* ----- 羅馬音容錯比對（產出型輸入）：hepburn 標準 + 常見替代拼法 ----- */
  const ROMAJI_ALIASES = {
    si: "shi", ti: "chi", tu: "tsu", hu: "fu", zi: "ji", di: "ji", du: "zu",
    sya: "sha", syu: "shu", syo: "sho", tya: "cha", tyu: "chu", tyo: "cho",
    zya: "ja", zyu: "ju", zyo: "jo", jya: "ja", jyu: "ju", jyo: "jo"
  };
  function romajiEq(input, answer) {
    const v = String(input || "").trim().toLowerCase().replace(/[^a-z]/g, "");
    return !!v && (v === answer || ROMAJI_ALIASES[v] === answer);
  }

  /* ----- 課後總結 ----- */
  function sessionSummary(s) {
    const acc = s.total ? Math.round(s.correct / s.total * 100) : 0;
    const secs = Math.max(1, Math.round((Date.now() - s.startTs) / 1000));
    const weak = Object.keys(s.missed || {}).sort((a, b) => s.missed[b] - s.missed[a]).slice(0, 3);
    const goalTxt = "今日 " + P.daily.todayCount + " / " + P.daily.goal + (P.daily.todayCount >= P.daily.goal ? " ✅ 達標" : "");
    return '<div class="summary">' +
      '<div class="srow"><span>正確率</span><b>' + acc + "%</b></div>" +
      '<div class="srow"><span>用時</span><b>' + secs + " 秒</b></div>" +
      (weak.length ? '<div class="srow"><span>最弱</span><b>' + weak.map(esc).join("　") + "</b></div>" : "") +
      '<div class="srow"><span>連續</span><b>🔥 ' + (P.daily.streakDays || 0) + " 天</b></div>" +
      '<div class="srow"><span>目標</span><b>' + goalTxt + "</b></div></div>";
  }

  let examTimer = null;
  function clearTimers() { if (examTimer) { clearInterval(examTimer); examTimer = null; } TTS.stop(); }
  function render(html) { clearTimers(); $app.innerHTML = html; }

  /* =====================  首頁  ===================== */
  function homeScreen() {

    const rows = LEVELS.map(lv => {
      const locked = lv.id > P.unlocked;

      return '<div class="level-row' + (locked ? " locked" : "") + '" data-lv="' + lv.id + '">' +
        '<div class="badge">' + (locked ? "🔒" : (mastered ? "✓" : lv.id)) + "</div>" +
        '<div class="info"><div class="name">' + esc(lv.name) + "</div>" +

    const weak = ALL_KANA

      : '<div class="progress-note">目前沒有弱項，太棒了！練習中按「✗忘了」的假名會出現在這裡。</div>';

    const goalPct = Math.min(100, Math.round(P.daily.todayCount / P.daily.goal * 100));
    render(
      '<div class="topbar"><div><h1>五十音練習器</h1>' +

      '<div class="goalbar"><i style="width:' + goalPct + '%"></i><span>今日 ' + P.daily.todayCount + ' / ' + P.daily.goal + ' 題</span></div>' +
      (!TTS.enabled ? '<div class="banner">🔇 此環境不支援語音，已切換靜音模式：考試將不出聽選題。</div>' : "") +
      (due ? '<div class="banner due">📌 今日尚有 <b>' + due + '</b> 張到期複習，趁記憶正要淡去時複習效果最佳。</div>' : "") +
      '<div class="actions">' +
      '<button class="act primary" id="review"' + (due ? "" : " disabled") + '>📅 今日複習<span class="cnt">' + (due ? due + " 張到期" : "已完成 ✅") + '</span></button>' +
      '<button class="act" id="challenge">🎯 總複習 / 挑戰</button>' +
      '<button class="act" id="confuse">🔀 易混淆特訓</button>' +
      (TTS.enabled ? '<button class="act" id="audio">🔊 聽音辨形</button><button class="act" id="shadow">🗣️ 跟讀練習</button>' : "") +
      "</div>" +
      '<div class="levels">' + rows + "</div>" +
      '<div class="panel"><h2>弱項榜 ・ 已精熟 ' + masteredCount() + " / " + ALL_KANA.length + " 音</h2>" + weakHtml + "</div>"
    );
    const rv = $app.querySelector("#review");
    rv.addEventListener("click", () => {
      const q = reviewQueue();
      if (!q.length) return;
      practiceScreen({ title: "今日複習", sub: "間隔重複到期", set: q, onBack: homeScreen, rounds: 1 });
    });

  /* =====================  級別頁  ===================== */
  function levelScreen(id) {

    $app.querySelectorAll("[data-part]").forEach(btn => btn.addEventListener("click", () => {
      const part = +btn.dataset.part;

      const cfg = { title: lv.name, sub: "Part " + part + " " + partName, set, onBack: () => levelScreen(lv.id) };
      if (P.warmup && TTS.enabled) warmupScreen(cfg); else practiceScreen(cfg);

  /* =====================  熱身（可跳過） ===================== */
  function warmupScreen(cfg) {
    const set = cfg.set;
    render(
      '<div class="topbar"><div><h1>熱身跟讀</h1>' +
      '<div class="sub">' + esc(cfg.title) + " ・ 跟著唸一遍</div></div>" +
      '<button class="ghost small" id="skip">跳過 →</button></div>' +
      '<div class="warm-grid">' + set.map((x, i) =>
        '<span id="wk' + i + '">' + esc(x.k) + "</span>").join("") + "</div>" +
      '<div class="center progress-note" id="wnote">準備開始…</div>'
    );
    let i = 0, cancelled = false, timeout = null;
    const go = () => { cancelled = true; if (timeout) clearTimeout(timeout); practiceScreen(cfg); };
    $app.querySelector("#skip").addEventListener("click", go);
    (function step() {
      if (cancelled) return;
      if (i >= set.length) return go();
      $app.querySelectorAll(".warm-grid span").forEach(s => s.classList.remove("now"));
      const el = $app.querySelector("#wk" + i);
      if (el) el.classList.add("now");
      const note = $app.querySelector("#wnote");
      if (note) note.textContent = set[i].k + "（" + set[i].r + "）";
      TTS.speak(set[i].k);
      i++;
      timeout = setTimeout(step, 1600);
    })();
  }

  /* =====================  翻牌練習（通用；支援 audioFront 音先於形） ===================== */
  function practiceScreen(cfg) {
    const set = cfg.set;
    const backTo = cfg.onBack || homeScreen;
    if (!set || !set.length) return backTo();
    const total = cfg.total || set.length * (cfg.rounds || 2);
    const audioFront = cfg.audioFront && TTS.enabled;
    let done = 0, lastK = null, hits = 0;
    const missed = {}, startTs = Date.now();

    function head() {
      return '<div class="topbar"><div><h1>' + esc(cfg.title) + "</h1>" +
        '<div class="sub">' + (cfg.sub ? esc(cfg.sub) + " ・ " : "") + "第 " + (done + 1) + " / " + total + ' 張</div></div>' +
        '<button class="ghost small" id="quit">結束</button></div>';
    }

    function nextCard() {
      if (done >= total) return practiceDone();
      const x = weightedPick(set, lastK);
      lastK = x.k;
      const front = audioFront
        ? '<button class="shu" id="playf">🔊 播放發音</button><div class="tap-hint">聽發音、回想字形，再點卡揭曉</div>'
        : '<span class="' + kanaSizeClass(x.k) + '">' + esc(x.k) + '</span><div class="tap-hint">先在心裡唸出來，再點卡揭曉</div>';
      render(head() + '<div class="card-stage"><div class="tazuke" id="card">' + front + "</div></div>");
      $app.querySelector("#quit").addEventListener("click", backTo);
      const pf = $app.querySelector("#playf");
      if (pf) { pf.addEventListener("click", e => { e.stopPropagation(); TTS.speak(x.k); }); TTS.speak(x.k); }
      $app.querySelector("#card").addEventListener("click", () => revealCard(x), { once: true });
    }

    function revealCard(x) {
      const mastered = isMastered(x.k);   // 去中介化：精熟後字源預設收合
      render(
        head() +
        '<div class="card-stage"><div class="reveal">' +
        '<div class="romaji">' + esc(x.r) + '</div>' +
        '<div class="kana-mid">' + esc(x.k) + '</div>' +
        (mastered
          ? '<button class="linkbtn" id="showorigin">顯示字源</button><div class="origin" id="origin" hidden>' + esc(x.origin) + "</div>"
          : '<div class="origin">' + esc(x.origin) + "</div>") +
        '<div class="visual" id="vslot"></div>' +
        '<div class="word">' + esc(x.w) + "</div>" +
        '<div class="zh">' + esc(x.zh) + "</div>" +
        (TTS.enabled ? '<button class="ghost small replay-btn" id="replay" style="margin-top:10px">🔊 再聽一次</button>' : "") +
        "</div>" +
        '<div class="grade-btns">' +
        '<button class="shu" id="miss">✗ 忘了</button>' +
        '<button id="hit">✓ 記得</button></div></div>'
      );
      $app.querySelector("#vslot").replaceWith(visualEl(x));
      TTS.speak(x.k + "。" + speakable(x.w));
      $app.querySelector("#quit").addEventListener("click", backTo);
      const so = $app.querySelector("#showorigin");
      if (so) so.addEventListener("click", () => { so.remove(); const o = $app.querySelector("#origin"); if (o) o.hidden = false; });
      const rp = $app.querySelector("#replay");
      if (rp) rp.addEventListener("click", () => TTS.speak(x.k + "。" + speakable(x.w)));
      $app.querySelector("#hit").addEventListener("click", () => { markHit(x.k); hits++; done++; nextCard(); });
      $app.querySelector("#miss").addEventListener("click", () => { markMiss(x.k); missed[x.k] = (missed[x.k] || 0) + 1; done++; nextCard(); });
    }

    function practiceDone() {
      render(
        '<div class="result-box"><div class="big">🎉</div>' +
        '<div class="msg">' + esc(cfg.title) + " 練習完成！</div>" +
        sessionSummary({ correct: hits, total: done, missed, startTs }) +
        '<div class="btn-col">' +
        '<button id="again">再練一輪</button>' +
        '<button class="ghost" id="back">返回</button></div></div>'
      );
      $app.querySelector("#again").addEventListener("click", () => practiceScreen(cfg));
      $app.querySelector("#back").addEventListener("click", backTo);
    }
    nextCard();
  }

  /* =====================  考試（60 秒；通用 config） =====================
   * config = { title, set, poolAll, bestKey, onBack, onPass?, allowType? }
   * 題型：聽選 / 讀選 / 平片配對 /（allowType）鍵入羅馬音（產出型）。
   * 選項干擾優先取形近字（Noticing the Gap）。答錯播正確音、餵入權重與 SRS。
   * =================================================================== */
  function examScreen(cfg) {
    const EXAM_SEC = 60;
    const set = cfg.set, poolAll = cfg.poolAll;
    const types = [];
    if (TTS.enabled) types.push("listen");        // 無語音剔除聽選
    types.push("read", "match");
    if (cfg.allowType) types.push("type");         // 產出型回憶（Pushed Output）
    const backTo = cfg.onBack || homeScreen;

    let score = 0, answered = 0, remain = EXAM_SEC, lastK = null, locked = false, hits = 0;
    const missed = {}, startTs = Date.now();

    function makeQuestion() {
      const type = types[Math.floor(Math.random() * types.length)];
      const x = weightedPick(set, lastK);
      lastK = x.k;
      if (type === "read") return { type, x, answer: x.r, options: distractors(poolAll, x, 3, o => o.r) };
      if (type === "type") return { type, x, answer: x.r };
      if (type === "listen") {
        const sameType = poolAll.filter(o => o.type === x.type);
        return { type, x, answer: x.k, options: distractors(sameType, x, 3, o => o.k, confusablePool(sameType, x.k)) };
      }
      // match：平片配對（雙向）
      const oppo = poolAll.filter(o => o.type !== x.type);
      const correct = BY_K[x.pair] || { k: x.pair };
      return { type, x, answer: correct.k, options: distractors(oppo, correct, 3, o => o.k, confusablePool(oppo, correct.k)) };
    }

    function header() {
      return '<div class="exam-head"><div class="exam-score">得分 ' + score + " 題</div>" +
        '<div class="progress-note">剩餘 <b id="sec">' + remain + '</b> 秒</div>' +
        '<button class="ghost small" id="quit">放棄</button></div>' +
        '<div class="timerbar"><i id="bar" style="width:' + (remain / EXAM_SEC * 100) + '%"></i></div>';
    }

    function grade(right, q, btn) {
      if (locked) return;
      locked = true; answered++;
      if (right) { score++; hits++; markHit(q.x.k); if (btn) btn.classList.add("hit"); }
      else {
        markMiss(q.x.k);                 // 答錯餵入權重 + SRS
        missed[q.x.k] = (missed[q.x.k] || 0) + 1;
        TTS.speak(q.x.k);                // 答錯播正確音
        if (btn) btn.classList.add("miss");
        $app.querySelectorAll(".opts button").forEach(b => { if (b.dataset.v === q.answer) b.classList.add("hit"); });
        const tin = $app.querySelector("#tin");
        if (tin) { tin.classList.add("wrong"); tin.value = q.answer; tin.disabled = true; }
      }
      const scoreEl = $app.querySelector(".exam-score");
      if (scoreEl) scoreEl.textContent = "得分 " + score + " 題";
      setTimeout(() => { if (remain > 0) showQuestion(); else finish(); }, right ? 350 : 950);
    }

    function showQuestion() {
      if (remain <= 0) return finish();
      locked = false;
      const q = makeQuestion();
      const kCls = q.x.k.length > 1 ? "k multi" : "k";
      let promptHtml;
      if (q.type === "listen") {
        promptHtml = '<div class="label">聽發音，選出正確的假名</div><button class="shu" id="playq">🔊 播放發音</button>';
      } else if (q.type === "read") {
        promptHtml = '<div class="label">這個假名的羅馬音是？</div><div class="' + kCls + '">' + esc(q.x.k) + "</div>";
      } else if (q.type === "type") {
        promptHtml = '<div class="label">鍵入這個假名的羅馬音</div><div class="' + kCls + '">' + esc(q.x.k) + "</div>";
      } else {
        promptHtml = '<div class="label">' + (q.x.type === "hira" ? "選出對應的片假名" : "選出對應的平假名") +
          '</div><div class="' + kCls + '">' + esc(q.x.k) + "</div>";
      }
      const answerHtml = q.type === "type"
        ? '<form class="typebox" id="typef"><input id="tin" type="text" inputmode="latin" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="羅馬音…"><button class="shu" type="submit">送出</button></form>'
        : '<div class="opts">' + q.options.map(o => '<button data-v="' + esc(o) + '">' + esc(o) + "</button>").join("") + "</div>";
      render(header() + '<div class="q-prompt">' + promptHtml + "</div>" + answerHtml);
      startTick();
      $app.querySelector("#quit").addEventListener("click", backTo);
      const pq = $app.querySelector("#playq");
      if (pq) { pq.addEventListener("click", () => TTS.speak(q.x.k)); TTS.speak(q.x.k); }
      if (q.type === "type") {
        const inp = $app.querySelector("#tin");
        inp.focus();
        $app.querySelector("#typef").addEventListener("submit", e => { e.preventDefault(); grade(romajiEq(inp.value, q.answer), q, null); });
      } else {
        $app.querySelectorAll(".opts button").forEach(btn =>
          btn.addEventListener("click", () => grade(btn.dataset.v === q.answer, q, btn)));
      }
    }

    function startTick() {
      if (examTimer) return;
      examTimer = setInterval(() => {
        remain--;
        const s = $app.querySelector("#sec"), b = $app.querySelector("#bar");
        if (s) s.textContent = remain;
        if (b) b.style.width = (Math.max(0, remain) / EXAM_SEC * 100) + "%";
        if (remain <= 0) { clearInterval(examTimer); examTimer = null; finish(); }
      }, 1000);
    }

    function finish() {
      clearTimers();
      const prevBest = P.best[cfg.bestKey];
      if (prevBest == null || score > prevBest) P.best[cfg.bestKey] = score;
      const passHtml = cfg.onPass ? cfg.onPass(score) : "";
      save();
      render(
        '<div class="result-box"><div class="big">' + score + ' 題</div>' +
        '<div class="msg">' + esc(cfg.title) + " 結束（作答 " + answered + " 題）" +
        (cfg.onPass ? "<br>" + (score >= 12 ? "通過標準（≥ 12 題）！" : "還差 " + (12 - score) + " 題就能解鎖下一級，加油！") : "") + "</div>" +
        passHtml +
        sessionSummary({ correct: hits, total: answered, missed, startTs }) +
        '<div class="btn-col">' +
        '<button class="shu" id="again">再考一次</button>' +
        '<button class="ghost" id="back">返回</button>' +
        '<button class="ghost" id="home">回首頁</button></div></div>'
      );
      $app.querySelector("#again").addEventListener("click", () => examScreen(cfg));
      $app.querySelector("#back").addEventListener("click", backTo);
      $app.querySelector("#home").addEventListener("click", homeScreen);
    }

    showQuestion();
  }

  // 各級考試 config：題組=當級、干擾池=已解鎖、通過解鎖下一級（行為與原本一致）
  function levelExamCfg(lv) {
    const poolAll = [];
    LEVELS.filter(l => l.id <= Math.max(P.unlocked, lv.id)).forEach(l => poolAll.push(...l.hira, ...l.kata));
    return {
      title: lv.name + " 考試", set: lv.hira.concat(lv.kata), poolAll, bestKey: lv.id,
      onBack: () => levelScreen(lv.id),
      onPass: (score) => {
        if (score >= 12) {
          const next = lv.id + 1;
          if (next <= LEVELS.length && P.unlocked < next) { P.unlocked = next; return '<div class="unlock">🎊 已解鎖 ' + esc(LEVELS[next - 1].name) + "！</div>"; }
          if (next > LEVELS.length) return '<div class="unlock">🏆 你已完成全部級別！</div>';
        }
        return "";
      }
    };
  }

  /* =====================  總複習 / 挑戰（跨級交錯） ===================== */
  function challengeSetupScreen() {
    const maxLv = P.unlocked;
    const STAGES = [{ label: "1–5 級", lo: 1, hi: 5 }, { label: "6–10 級", lo: 6, hi: 10 },
      { label: "11–14 級", lo: 11, hi: 14 }, { label: "全部", lo: 1, hi: maxLv }]
      .filter(s => s.lo <= maxLv).map(s => ({ label: s.label, lo: s.lo, hi: Math.min(s.hi, maxLv) }));
    const kindsOpts = [{ label: "平+片", v: "both" }, { label: "只平假", v: "hira" }, { label: "只片假", v: "kata" }];
    const modeOpts = [{ label: "翻牌複習", v: "flash" }, { label: "60 秒挑戰", v: "exam" }];
    let rangeIdx = STAGES.length - 1, kindsIdx = 0, modeIdx = 0, input = false;

    function segHtml(id, opts, cur) {
      return '<div class="seg" data-seg="' + id + '">' + opts.map((o, i) =>
        '<button class="' + (i === cur ? "on" : "") + '" data-i="' + i + '">' + esc(o.label) + "</button>").join("") + "</div>";
    }
    function draw() {
      render(
        '<div class="topbar"><div><h1>總複習 / 挑戰</h1><div class="sub">跨級交錯練習（強化編碼變異）</div></div>' +
        '<button class="ghost small" id="back">← 返回</button></div>' +
        '<div class="setup">' +
        '<div class="setlabel">範圍</div>' + segHtml("range", STAGES, rangeIdx) +
        '<div class="setlabel">假名種類</div>' + segHtml("kinds", kindsOpts, kindsIdx) +
        '<div class="setlabel">模式</div>' + segHtml("mode", modeOpts, modeIdx) +
        (modeOpts[modeIdx].v === "exam"
          ? '<label class="check-row"><input type="checkbox" id="inp"' + (input ? " checked" : "") + ">輸入模式：鍵入羅馬音（產出型回憶，較深編碼）</label>" : "") +
        '<button class="start" id="start" style="margin-top:18px;width:100%">開始</button></div>'
      );
      $app.querySelector("#back").addEventListener("click", homeScreen);
      $app.querySelectorAll('[data-seg="range"] button').forEach(b => b.addEventListener("click", () => { rangeIdx = +b.dataset.i; draw(); }));
      $app.querySelectorAll('[data-seg="kinds"] button').forEach(b => b.addEventListener("click", () => { kindsIdx = +b.dataset.i; draw(); }));
      $app.querySelectorAll('[data-seg="mode"] button').forEach(b => b.addEventListener("click", () => { modeIdx = +b.dataset.i; draw(); }));
      const inp = $app.querySelector("#inp"); if (inp) inp.addEventListener("change", e => { input = e.target.checked; });
      $app.querySelector("#start").addEventListener("click", start);
    }
    function start() {
      const rg = STAGES[rangeIdx], kinds = kindsOpts[kindsIdx].v, mode = modeOpts[modeIdx].v;
      const set = rangeKana(rg.lo, rg.hi, kinds);
      if (!set.length) return;
      const title = "挑戰 " + rg.label;
      if (mode === "flash") return practiceScreen({ title, sub: kindsOpts[kindsIdx].label, set, onBack: challengeSetupScreen, rounds: 1 });
      examScreen({ title, set, poolAll: rangeKana(rg.lo, rg.hi, "both"),
        bestKey: "challenge:" + rg.lo + "-" + rg.hi + ":" + kinds + (input ? ":type" : ""),
        onBack: challengeSetupScreen, allowType: input });
    }
    draw();
  }

  /* =====================  易混淆特訓（Noticing the Gap） ===================== */
  function confuseDrill() {
    const pool = unlockedKana();
    const set = pool.filter(x => CONFUSABLES[x.k]);
    if (!set.length) return homeScreen();
    examScreen({ title: "易混淆特訓", set, poolAll: pool, bestKey: "confuse", onBack: homeScreen });
  }

  /* =====================  聽音辨形（音先於形） ===================== */
  function audioFirstScreen() {
    practiceScreen({ title: "聽音辨形", sub: "先聽發音再回想字形", set: unlockedKana(), onBack: homeScreen, audioFront: true, rounds: 1 });
  }

  /* =====================  跟讀練習（影子跟讀簡化：聽→哼→影子） ===================== */
  function shadowScreen() {
    const set = unlockedKana();
    let i = 0;
    function show() {
      if (i >= set.length) return homeScreen();
      const x = set[i];
      render(
        '<div class="topbar"><div><h1>跟讀練習</h1><div class="sub">已解鎖假名 ・ ' + (i + 1) + " / " + set.length + "</div></div>" +
        '<button class="ghost small" id="quit">結束</button></div>' +
        '<div class="card-stage"><div class="reveal">' +
        '<div class="kana-mid" style="font-size:3.4rem">' + esc(x.k) + "</div>" +
        '<div class="romaji" style="font-size:1.4rem">' + esc(x.r) + "</div>" +
        '<div class="word">' + esc(x.w) + '</div><div class="zh">' + esc(x.zh) + "</div>" +
        '<div class="progress-note" style="margin-top:8px">① 聽　② 小聲哼　③ 像影子一樣跟著唸</div>' +
        '<button class="ghost small replay-btn" id="replay" style="margin-top:10px">🔊 再聽一次</button></div>' +
        '<div class="grade-btns"><button id="next">下一個 →</button></div></div>'
      );
      $app.querySelector("#quit").addEventListener("click", homeScreen);
      $app.querySelector("#replay").addEventListener("click", () => TTS.speak(x.k + "。" + speakable(x.w)));
      $app.querySelector("#next").addEventListener("click", () => { i++; show(); });
      TTS.speak(x.k + "。" + speakable(x.w));
    }
    show();
  }

  /* =====================  啟動  ===================== */
  (async function boot() {
    try {
      const saved = await store.get();
      if (saved && typeof saved === "object") {
        Object.assign(P.weights, saved.weights || {});
        Object.assign(P.streak, saved.streak || {});
        Object.assign(P.best, saved.best || {});
        if (saved.srs) Object.assign(P.srs, saved.srs);
        if (saved.daily) Object.assign(P.daily, saved.daily);
        if (typeof saved.unlocked === "number") P.unlocked = saved.unlocked;
        P.warmup = !!saved.warmup;
      }
    } catch (e) {}
    initKeys();
    if (params.get("unlock") === "all") { P.unlocked = LEVELS.length; }   // 測試後門
    P.unlocked = Math.min(Math.max(1, P.unlocked), LEVELS.length);
    homeScreen();
  })();

  /* ---------- PWA：file:// 開啟時自動略過，不影響運作 ---------- */
  if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("sw.js").catch(() => {});
    });
  }
})();
</script>
