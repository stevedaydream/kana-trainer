<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>五十音練習器</title>
<meta name="description" content="翻牌提取練習 × 錯題加權 × 十級解鎖的五十音練習器">
<meta name="theme-color" content="#1f4788">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="img/icon-192.png">
<style>
:root{
  --ruri:#1f4788;      /* 瑠璃紺 */
  --ruri-light:#3a6bb5;
  --shu:#eb6101;       /* 朱色 */
  --sumi:#2b2b2b;      /* 墨色 */
  --paper:#f7f4ec;
  --card:#fffdf7;
  --line:#d8d2c4;
  --ok:#2e7d32;
  --ng:#c62828;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:16px}
body{
  font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Noto Sans TC","Yu Gothic","Microsoft JhengHei",sans-serif;
  background:var(--paper);color:var(--sumi);min-height:100vh;
}
#app{max-width:520px;margin:0 auto;padding:16px 16px 48px}
h1{font-size:1.5rem;color:var(--ruri);letter-spacing:.1em}
.sub{color:#8a8272;font-size:.85rem;margin-top:4px}
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
button{
  font-family:inherit;font-size:1rem;border:none;border-radius:10px;
  padding:12px 16px;cursor:pointer;background:var(--ruri);color:#fff;
  transition:transform .06s, opacity .2s;
}
button:active{transform:scale(.97)}
button.ghost{background:transparent;color:var(--ruri);border:1.5px solid var(--ruri)}
button.shu{background:var(--shu)}
button.small{font-size:.85rem;padding:8px 12px;border-radius:8px}
button:disabled{opacity:.45;cursor:default}
.banner{
  background:#fff6e8;border:1px solid #f0d9b0;border-radius:10px;
  padding:10px 12px;font-size:.85rem;color:#8a6d3b;margin-bottom:14px;
}
.banner.err{background:#fdecea;border-color:#f2b8b5;color:var(--ng)}
/* ---- 級別列表 ---- */
.levels{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.level-row{
  display:flex;align-items:center;gap:12px;background:var(--card);
  border:1px solid var(--line);border-radius:12px;padding:14px;
  cursor:pointer;box-shadow:0 1px 3px rgba(43,43,43,.06);
}
.level-row.locked{opacity:.55;cursor:default}
.level-row .badge{
  width:44px;height:44px;border-radius:10px;display:flex;align-items:center;justify-content:center;
  background:var(--ruri);color:#fff;font-weight:bold;font-size:1.1rem;flex-shrink:0;
}
.level-row.locked .badge{background:#a9a292}
.level-row .info{flex:1}
.level-row .name{font-weight:600}
.level-row .meta{font-size:.78rem;color:#8a8272;margin-top:2px}
.level-row .score{font-size:.85rem;color:var(--shu);font-weight:600;white-space:nowrap}
/* ---- 弱項榜 ---- */
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:20px}
.panel h2{font-size:1rem;color:var(--ruri);margin-bottom:10px}
.weak-list{display:flex;flex-wrap:wrap;gap:8px}
.weak-chip{
  display:inline-flex;align-items:center;gap:6px;background:#fdf0e6;border:1px solid #f3cdae;
  border-radius:999px;padding:6px 12px;font-size:1rem;
}
.weak-chip b{color:var(--shu);font-size:.78rem}
/* ---- 田字格卡片 ---- */
.card-stage{display:flex;flex-direction:column;align-items:center;gap:16px;margin-top:8px}
.tazuke{
  position:relative;width:min(78vw,300px);height:min(78vw,300px);
  background:var(--card);border:2px solid var(--ruri);border-radius:14px;
  display:flex;align-items:center;justify-content:center;cursor:pointer;
  box-shadow:0 3px 10px rgba(31,71,136,.12);user-select:none;
}
.tazuke::before,.tazuke::after{
  content:"";position:absolute;background:transparent;pointer-events:none;
}
.tazuke::before{left:50%;top:6%;bottom:6%;border-left:1.5px dashed #c9d4e6}
.tazuke::after{top:50%;left:6%;right:6%;border-top:1.5px dashed #c9d4e6}
.kana-big{font-size:104px;color:var(--sumi);line-height:1;z-index:1}
.kana-big.multi{font-size:64px}
.tap-hint{position:absolute;bottom:10px;left:0;right:0;text-align:center;font-size:.75rem;color:#a9a292}
/* ---- 揭曉面 ---- */
.reveal{width:min(78vw,300px);background:var(--card);border:2px solid var(--shu);border-radius:14px;padding:16px;text-align:center}
.reveal .romaji{font-size:2rem;color:var(--shu);font-weight:700;letter-spacing:.05em}
.reveal .kana-mid{font-size:2.6rem;margin-top:2px}
.reveal .origin{font-size:.85rem;color:var(--ruri);margin-top:8px;line-height:1.5}
.reveal .visual{margin:10px auto;width:96px;height:96px;display:flex;align-items:center;justify-content:center}
.reveal .visual img,.reveal .visual svg{max-width:96px;max-height:96px}
.reveal .visual .emoji{font-size:64px;line-height:1}
.reveal .word{font-size:1.1rem;margin-top:4px}
.reveal .zh{font-size:.85rem;color:#8a8272;margin-top:2px}
.grade-btns{display:flex;gap:14px;margin-top:4px}
.grade-btns button{min-width:120px}
.progress-note{font-size:.8rem;color:#8a8272}
/* ---- 考試 ---- */
.exam-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.exam-score{font-weight:700;color:var(--ruri)}
.timerbar{height:8px;background:#e5dfd2;border-radius:4px;overflow:hidden;margin-bottom:18px}
.timerbar i{display:block;height:100%;background:var(--shu);border-radius:4px;transition:width .3s linear}
.q-prompt{
  background:var(--card);border:2px solid var(--ruri);border-radius:14px;
  min-height:130px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:8px;padding:16px;margin-bottom:16px;text-align:center;
}
.q-prompt .k{font-size:72px;line-height:1.1}
.q-prompt .k.multi{font-size:48px}
.q-prompt .label{font-size:.85rem;color:#8a8272}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opts button{
  background:var(--card);color:var(--sumi);border:1.5px solid var(--line);
  font-size:1.5rem;padding:16px 8px;border-radius:12px;
}
.opts button.hit{background:#e6f4e6;border-color:var(--ok);color:var(--ok)}
.opts button.miss{background:#fdecea;border-color:var(--ng);color:var(--ng)}
.replay-btn{margin:0 auto}
/* ---- 結果 ---- */
.result-box{text-align:center;padding:28px 0}
.result-box .big{font-size:3rem;font-weight:700;color:var(--ruri)}
.result-box .msg{margin-top:10px;font-size:1.05rem}
.result-box .unlock{color:var(--shu);font-weight:700;margin-top:8px}
.btn-col{display:flex;flex-direction:column;gap:10px;margin-top:24px;align-items:center}
.btn-col button{min-width:220px}
/* ---- 級別頁 ---- */
.part-list{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.part-list button{display:flex;justify-content:space-between;align-items:center;background:var(--card);color:var(--sumi);border:1.5px solid var(--line);padding:15px;font-size:1rem}
.part-list button .tag{font-size:.78rem;color:#fff;background:var(--ruri);border-radius:6px;padding:2px 8px}
.part-list button.exam .tag{background:var(--shu)}
.check-row{display:flex;align-items:center;gap:8px;margin-top:16px;font-size:.9rem;color:#5c5647}
.check-row input{width:18px;height:18px;accent-color:var(--shu)}
/* ---- 熱身 ---- */
.warm-grid{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:18px 0}
.warm-grid span{
  width:56px;height:56px;display:flex;align-items:center;justify-content:center;
  background:var(--card);border:1.5px solid var(--line);border-radius:10px;font-size:1.6rem;
  transition:all .15s;
}
.warm-grid span.now{background:var(--ruri);color:#fff;border-color:var(--ruri);transform:scale(1.15)}
.center{text-align:center}
a{color:var(--ruri)}
/* ---- 每日 / 連續天數 ---- */
.streak{background:#fdf0e6;border:1px solid #f3cdae;color:var(--shu);font-weight:700;border-radius:999px;padding:6px 12px;font-size:.9rem;white-space:nowrap}
.goalbar{position:relative;height:20px;background:#e5dfd2;border-radius:10px;overflow:hidden;margin-bottom:14px}
.goalbar i{display:block;height:100%;background:linear-gradient(90deg,var(--ruri),var(--ruri-light));border-radius:10px;transition:width .4s}
.goalbar span{position:absolute;inset:0;text-align:center;font-size:.72rem;line-height:20px;color:var(--sumi)}
.banner.due{background:#eef4ff;border-color:#c3d4ef;color:var(--ruri)}
/* ---- 首頁行動入口 ---- */
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:4px 0 6px}
.act{display:flex;flex-direction:column;align-items:flex-start;gap:2px;background:var(--card);color:var(--sumi);border:1.5px solid var(--line);font-size:.95rem;padding:14px;text-align:left}
.act.primary{grid-column:1 / -1;background:var(--ruri);color:#fff;border-color:var(--ruri);flex-direction:row;justify-content:space-between;align-items:center;font-size:1.05rem;font-weight:600}
.act.primary:disabled{background:#a9a292;border-color:#a9a292}
.act .cnt{font-size:.85rem;opacity:.9;font-weight:400}
/* ---- 設定頁（分段選擇） ---- */
.setup{margin-top:8px}
.setlabel{font-size:.85rem;color:#8a8272;margin:14px 0 6px}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg button{background:var(--card);color:var(--sumi);border:1.5px solid var(--line);font-size:.9rem;padding:10px 14px;border-radius:10px;flex:1 1 auto}
.seg button.on{background:var(--ruri);color:#fff;border-color:var(--ruri)}
.start{font-size:1.05rem}
/* ---- 課後總結 ---- */
.summary{max-width:300px;margin:18px auto 0;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 16px;text-align:left}
.summary .srow{display:flex;justify-content:space-between;font-size:.9rem;padding:4px 0;border-bottom:1px dashed #ece6d8}
.summary .srow:last-child{border-bottom:none}
.summary .srow b{color:var(--ruri)}
/* ---- 產出型輸入 ---- */
.typebox{display:flex;gap:10px}
.typebox input{flex:1;font-family:inherit;font-size:1.3rem;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);color:var(--sumi);text-align:center}
.typebox input:focus{outline:none;border-color:var(--ruri)}
.typebox input.wrong{border-color:var(--ng);color:var(--ng)}
.linkbtn{background:none;border:none;color:var(--ruri);text-decoration:underline;font-size:.85rem;padding:6px;margin-top:6px}
/* ---- 聽音辨形：平/片對照 ---- */
.pairwrap{display:flex;align-items:center;justify-content:center;gap:14px;margin:2px 0 4px}
.pairwrap .pcell{display:flex;flex-direction:column;align-items:center}
.pairwrap .pcell .g{line-height:1}
.pairwrap .pcell.main .g{font-size:2.8rem;color:var(--sumi)}
.pairwrap .pcell.sub .g{font-size:1.9rem;color:#a9a292}
.pairwrap .plabel{font-size:.68rem;margin-top:5px}
.pairwrap .pcell.main .plabel{color:var(--ruri)}
.pairwrap .pcell.sub .plabel{color:#b7b0a0}
.pairwrap .psep{font-size:1.4rem;color:var(--shu)}
/* ---- 語音設定 ---- */
.topright{display:flex;align-items:center;gap:8px}
.iconbtn{background:var(--card);border:1.5px solid var(--line);color:var(--ruri);border-radius:999px;width:40px;height:40px;padding:0;font-size:1.1rem;display:flex;align-items:center;justify-content:center}
.settings select{width:100%;font-family:inherit;font-size:1rem;padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);color:var(--sumi)}
.settings input[type=range]{width:100%;accent-color:var(--shu);margin-top:4px}
.settings .rowval{display:flex;justify-content:space-between;align-items:baseline}
.settings .rowval b{color:var(--ruri);font-variant-numeric:tabular-nums}
.settings .preview{width:100%;margin-top:20px}
.settings .note{font-size:.8rem;color:#8a6d3b;background:#fff6e8;border:1px solid #f0d9b0;border-radius:10px;padding:10px 12px;margin-top:10px}
.settings .note.err{background:#fdecea;border-color:#f2b8b5;color:var(--ng)}
.settings .sec-h{font-size:1.05rem;color:var(--ruri);font-weight:700;margin:22px 0 8px;border-top:1px solid var(--line);padding-top:16px}
.settings .sec-h:first-child{border-top:none;padding-top:0;margin-top:4px}
.btn-row{display:flex;gap:10px;margin-top:10px}
.btn-row button{flex:1}
.settings textarea{width:100%;min-height:64px;margin-top:10px;font-family:inherit;font-size:.85rem;padding:10px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);color:var(--sumi);resize:vertical}
/* ---- 版本更新提示 ---- */
.updatebar{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:50;
  display:flex;align-items:center;gap:10px;max-width:calc(100% - 24px);
  background:var(--ruri);color:#fff;border-radius:12px;padding:10px 12px;font-size:.88rem;
  box-shadow:0 6px 20px rgba(31,71,136,.28)}
.updatebar button{padding:7px 12px;font-size:.82rem;border-radius:8px;white-space:nowrap}
.updatebar .go{background:#fff;color:var(--ruri);font-weight:700}
.updatebar .later{background:transparent;color:#dfe7f5;border:1px solid rgba(255,255,255,.45)}
/* ---- 辭庫管理 ---- */
.settings .wb-sel{display:flex;gap:8px;margin-top:6px}
.settings .wb-sel select{flex:1 1 0;min-width:0}
.settings .wb-row{display:flex;align-items:center;gap:8px;padding:9px 4px;border-bottom:1px dashed #ece6d8}
.settings .wb-row .ww{font-size:1.05rem;font-weight:700;flex:0 0 auto}
.settings .wb-row .wz{flex:1 1 0;min-width:0;font-size:.82rem;color:#8a8272;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.settings .wb-row .src{flex:0 0 auto;font-size:.68rem;border-radius:5px;padding:1px 5px}
.settings .wb-row .src.own{background:#fff4d6;color:#a2643a;border:1px solid #f0d98a}
.settings .wb-row .src.std{background:#eef2fa;color:var(--ruri);border:1px solid #d3ddf0}
.settings .wb-row button{flex:0 0 auto;padding:6px 9px;font-size:.8rem;border-radius:8px}
.settings .wb-empty{font-size:.85rem;color:#8a8272;padding:10px 4px}
.settings .wb-add{display:flex;gap:8px;margin-top:10px}
.settings .wb-add input{flex:1 1 0;min-width:0;font-family:inherit;font-size:.95rem;padding:10px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);color:var(--sumi)}
.settings .wb-add button{flex:0 0 auto}
/* ---- 今日計畫 ---- */
.panel.plan .task{display:flex;justify-content:space-between;align-items:center;padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;margin-top:8px;cursor:pointer;background:var(--paper)}
.panel.plan .task.ok{opacity:.6;background:#eef4ee;border-color:#cfe3cf;cursor:default}
.panel.plan .task .tk{font-size:.95rem}
.panel.plan .task .tp{font-size:.82rem;color:var(--shu);font-variant-numeric:tabular-nums}
/* ---- 弱項榜擴充 ---- */
.weak-chip.starred{background:#fff4d6;border-color:#f0d98a}
.weak-chip i{font-style:normal;color:#a2643a;font-size:.72rem}
.reveal-tools{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:10px}
.starbtn.on{background:#fff4d6;border-color:#e0b34d;color:#a2643a}
/* ---- 書寫練習 ---- */
.write-info{display:flex;align-items:center;justify-content:center;gap:14px;margin:6px 0 12px}
.write-info .wk{font-size:2rem}
.write-info .wr{font-size:1.2rem;color:var(--shu);font-weight:700}
.write-stage{display:flex;justify-content:center}
.write-stage canvas{width:min(86vw,320px);height:min(86vw,320px);background:var(--card);border:2px solid var(--ruri);border-radius:14px;touch-action:none;cursor:crosshair}
/* ---- 每日新聞 ---- */
.news-title{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.news-title .nt-ja{font-size:1.3rem;font-weight:700;color:var(--sumi)}
.news-title .nt-furi{font-size:.8rem;color:#a9a292;margin-top:2px}
.news-title .nt-zh{font-size:.95rem;color:var(--ruri);margin-top:4px}
.part-list .done{color:var(--ok);font-weight:700}
.part-list .tag.lock{background:#a9a292}
.news-reveal{text-align:center}
.n-ja{font-size:1.15rem;line-height:1.6;color:var(--sumi)}
.n-furi{font-size:.8rem;color:#a9a292;margin-top:2px}
.n-zh{font-size:.92rem;color:var(--ruri);margin-top:4px}
.n-en{font-size:.82rem;color:#8a8272;margin-top:2px}
.n-link{font-size:.8rem;color:var(--shu);margin-top:3px}
.read-body{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
.rd-para{padding:8px 0;border-bottom:1px dashed #ece6d8}
.toggles{margin-bottom:12px}
.vocab-row{display:flex;gap:8px;align-items:baseline;padding:8px 4px;border-bottom:1px dashed #ece6d8;cursor:pointer}
.vocab-row .vw{font-weight:700;min-width:64px}
.vocab-row .vr{font-size:.8rem;color:#a9a292;min-width:80px}
.vocab-row .vz{font-size:.9rem;color:var(--ruri)}
.vocab-row .vz i{font-style:normal;color:#b7b0a0;font-size:.72rem}
.gram-row{padding:8px 4px;border-bottom:1px dashed #ece6d8}
.sp-body,.sp-line{text-align:center}
.sp-line{padding:8px 0;border-bottom:1px dashed #ece6d8}
.rec-box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;text-align:center;display:flex;flex-direction:column;gap:10px}
.stepper{display:flex;gap:6px;margin-bottom:12px}
.stepper span{flex:1;height:6px;border-radius:3px;background:#e5dfd2}
.stepper span.past{background:var(--ruri-light)}
.stepper span.now{background:var(--shu)}
</style>
</head>
<body>
<div id="app"></div>
<script src="data/levels.js"></script>
<script src="data/wordbank.js"></script>
<script src="data/news.js"></script>
<script>
"use strict";
/* =====================================================================
 * 五十音練習器 主程式
 * 只透過 window.KANA_DATA 取資料；題庫更換零修改。
 * =================================================================== */
(function () {
  const $app = document.getElementById("app");
  const params = new URLSearchParams(location.search);

  /* ---------- 題庫載入防護 ---------- */
  const DATA = (window.KANA_DATA && Array.isArray(window.KANA_DATA.levels) && window.KANA_DATA.levels.length)
    ? window.KANA_DATA : null;
  if (!DATA) {
    $app.innerHTML =
      '<div class="topbar"><div><h1>五十音練習器</h1></div></div>' +
      '<div class="banner err"><b>題庫未載入</b><br>' +
      '找不到 <code>data/levels.js</code> 或其中沒有 <code>window.KANA_DATA</code>。<br>' +
      '請確認檔案存在後重新整理頁面。</div>';
    return;
  }
  const LEVELS = DATA.levels;
  const ALL_KANA = [];
  const BY_K = {};
  LEVELS.forEach(lv => (lv.hira.concat(lv.kata)).forEach(x => { ALL_KANA.push(x); BY_K[x.k] = x; }));

  /* ---------- 儲存層：window.storage → localStorage → 記憶體 ---------- */
  const STORE_KEY = "kana_trainer_v1";
  const store = (function () {
    try {
      if (window.storage && typeof window.storage.getItem === "function" && typeof window.storage.setItem === "function") {
        return {
          kind: "claude",
          async get() { try { const v = await window.storage.getItem(STORE_KEY); return v ? JSON.parse(typeof v === "string" ? v : v.value) : null; } catch (e) { return null; } },
          set(obj) { try { window.storage.setItem(STORE_KEY, JSON.stringify(obj)); } catch (e) {} }
        };
      }
    } catch (e) {}
    try {
      const t = "__kt_test__";
      window.localStorage.setItem(t, "1"); window.localStorage.removeItem(t);
      return {
        kind: "local",
        async get() { try { const v = window.localStorage.getItem(STORE_KEY); return v ? JSON.parse(v) : null; } catch (e) { return null; } },
        set(obj) { try { window.localStorage.setItem(STORE_KEY, JSON.stringify(obj)); } catch (e) {} }
      };
    } catch (e) {}
    let mem = null;
    return { kind: "memory", async get() { return mem; }, set(obj) { mem = obj; } };
  })();

  /* ---------- 進度狀態 ---------- */
  const DAY = 86400000;
  // FSRS-lite：DSR 模型（難度/穩定度/可提取度），目標留存 90%；不做梯度下降，208 音規模足夠。
  const FSRS = { G: 3, S0: { 1: 0.5, 3: 2, 4: 4 }, MASTER_S: 21 };
  const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
  const P = {
    weights: {}, streak: {}, best: {}, unlocked: 1, warmup: false,
    srs: {}, daily: { lastActiveDate: "", streakDays: 0, todayCount: 0, goal: 30 },
    tts: { persona: "default", voiceURI: "", rate: 0.85, pitch: 1.0, gender: "" },
    star: {},
    plan: { intensity: "normal", casualRandom: true, progress: { date: "", level: 0, weak: 0, random: 0, write: 0 } },
    news: { level: "N5", furigana: true, doneDays: {}, quizBest: {}, inputDone: {} },
    wb: {}   // 辭庫自訂層：{ "<假名>": { add: [{w,zh}], hide: ["<被隱藏的內建詞>"] } }
  };

  const WB_PREFIX_FREE = new Set(["を", "ん", "ヲ", "ン", "ぢ", "づ", "ヂ", "ヅ"]);
  const WB_KANA_ONLY = /^[ぁ-ゖゝゞァ-ヺー-ヾ]+$/;   // 平/片假名＋長音符・繰り返し記号
  function wbBase(k) { const l = WORDBANK[k]; return Array.isArray(l) ? l.filter(c => c && c.w && c.zh) : []; }
  function wbOwn(k) { const e = P.wb[k]; return (e && Array.isArray(e.add)) ? e.add.filter(c => c && c.w && c.zh) : []; }
  function wbHidden(k) { const e = P.wb[k]; return new Set((e && Array.isArray(e.hide)) ? e.hide : []); }
  function wbEnsure(k) {
    const e = P.wb[k] || (P.wb[k] = { add: [], hide: [] });

    if (!w) return "請輸入單詞。";
    if (!zh) return "請輸入中文意思。";
    if (!WB_KANA_ONLY.test(w)) return "單詞請只用假名（可含長音符「ー」），不要漢字或空白。";
    if (WB_PREFIX_FREE.has(k)) { if (w.indexOf(k) < 0) return "「" + k + "」不作詞首，單詞須「包含」" + k + "。"; }
    else if (w.indexOf(k) !== 0) return "單詞必須以「" + k + "」開頭。";

  function wbAdd(k, w, zh) {   // 新增或覆寫（同 w 視為改中文）

    const base = wbBase(k).find(c => c.w === w);
    const j = e.add.findIndex(c => c.w === w);
    if (base && base.zh === zh) { if (j >= 0) e.add.splice(j, 1); } // 改回跟內建一樣就不用存

  }
  function wbRemove(k, w) {
    const e = wbEnsure(k);
    const j = e.add.findIndex(c => c.w === w); if (j >= 0) e.add.splice(j, 1);
    // 內建詞不能真的刪（內容檔唯讀），改記在 hide；純自訂詞上面已移除
    if (wbBase(k).some(c => c.w === w) && !e.hide.includes(w)) e.hide.push(w);

  function wbReset(k) { delete P.wb[k]; save(); }
  // 練習揭曉：某假名若有多詞則隨機抽一個，全被隱藏或本來就沒有時退回題庫單一 w/zh
  function pickWord(x) {
    const list = wbList(x.k);
    if (list.length) { const c = list[Math.floor(Math.random() * list.length)]; if (c && c.w) return c; }
    return { w: x.w, zh: x.zh };
  }
  // 學習強度預設：每日新級數、弱項頻率、隨機考次數、每 N 天一級
  const INTENSITY = {
    high: { id: "high", label: "高強度", levelsPerDay: 2, weakDaily: true, randomPerDay: 2, levelEveryNDays: 1 },
    normal: { id: "normal", label: "一般", levelsPerDay: 1, weakDaily: true, randomPerDay: 1, levelEveryNDays: 1 },
    casual: { id: "casual", label: "休閒", levelsPerDay: 1, weakDaily: "alt", randomPerDay: 1, levelEveryNDays: 2 }
  };
  function initKeys() {
    ALL_KANA.forEach(x => {
      if (!(x.k in P.weights)) P.weights[x.k] = 1;   // 新假名自動補 1
      if (!(x.k in P.streak)) P.streak[x.k] = 0;
      if (!(x.k in P.srs)) P.srs[x.k] = { D: 5, S: 0, last: 0, reps: 0, lapses: 0 };
    });
  }
  function save() {
    store.set({ weights: P.weights, streak: P.streak, best: P.best, unlocked: P.unlocked,
      warmup: P.warmup, srs: P.srs, daily: P.daily, tts: P.tts, star: P.star, plan: P.plan, news: P.news, wb: P.wb });
  }
  function snapshot() {   // 供 JSON 備份：完整存檔物件
    return { weights: P.weights, streak: P.streak, best: P.best, unlocked: P.unlocked,
      warmup: P.warmup, srs: P.srs, daily: P.daily, tts: P.tts, star: P.star, plan: P.plan, news: P.news, wb: P.wb };
  }

  /* ----- FSRS-lite 間隔重複排程 ----- */
  function srsUpdate(k, rating) {   // rating: 1=Again(✗) / 3=Good(✓) / 4=Easy
    const now = Date.now();
    const s = P.srs[k] || (P.srs[k] = { D: 5, S: 0, last: 0, reps: 0, lapses: 0 });
    if (s.reps === 0) {
      s.D = clamp(6 - (rating - 3), 1, 10);
      s.S = FSRS.S0[rating] || FSRS.S0[3];
    } else {
      const elapsed = (now - s.last) / DAY;
      const R = Math.exp(Math.log(0.9) * elapsed / Math.max(s.S, 0.01)); // 可提取度
      if (rating === 1) { s.S = Math.max(0.2, s.S * 0.3); s.D = clamp(s.D + 1, 1, 10); s.lapses++; }
      else { s.S = s.S * (1 + FSRS.G * (1 - R) * (11 - s.D) / 10); s.D = clamp(s.D - 0.3, 1, 10); } // R 越低成長越大＝合宜困難度
    }
    s.last = now;
    // 失敗（Again）當日重練：due 設為現在，立即回到今日複習佇列；成功則依穩定度排程
    s.due = rating === 1 ? now : now + s.S * DAY;
    s.reps++;
  }
  function dueOf(k) {
    const s = P.srs[k];
    if (!s || s.reps === 0) return Infinity;
    return s.due != null ? s.due : s.last + s.S * DAY;  // 舊存檔無 due 時回退
  }
  function isMastered(k) { const s = P.srs[k]; return !!(s && s.S >= FSRS.MASTER_S); }
  function masteredCount() { return ALL_KANA.reduce((n, x) => n + (isMastered(x.k) ? 1 : 0), 0); }

  /* ----- 每日目標 / 連續天數（呼應 24 小時鞏固循環） ----- */
  function dayKey(ts) {
    const d = new Date(ts), m = String(d.getMonth() + 1).padStart(2, "0"), dd = String(d.getDate()).padStart(2, "0");
    return d.getFullYear() + "-" + m + "-" + dd;
  }
  function bumpDaily() {
    const t = dayKey(Date.now());
    if (P.daily.lastActiveDate !== t) {
      const prev = P.daily.lastActiveDate;
      const gap = prev ? Math.round((Date.parse(t) - Date.parse(prev)) / DAY) : Infinity;
      P.daily.streakDays = gap === 1 ? (P.daily.streakDays || 0) + 1 : 1;
      P.daily.lastActiveDate = t;
      P.daily.todayCount = 0;
    }
    P.daily.todayCount++;
  }

  function markMiss(k) {
    P.weights[k] = Math.min(16, (P.weights[k] || 1) * 4); P.streak[k] = 0;
    srsUpdate(k, 1); bumpDaily(); save();
  }
  function markHit(k, easy) {
    P.streak[k] = (P.streak[k] || 0) + 1;
    P.weights[k] = P.streak[k] >= 2 ? 1 : Math.max(1, (P.weights[k] || 1) / 2);

  /* ---------- 語音人格預設（程式資產）：以音高/語速近似，依裝置語音自動挑性別 ---------- */
  const PERSONAS = [
    { id: "default", label: "標準", pitch: 1.0, rate: 0.85, gender: "" },
    { id: "cute_f", label: "可愛女聲", pitch: 1.6, rate: 1.0, gender: "f" },
    { id: "sexy_f", label: "性感女聲", pitch: 0.9, rate: 0.78, gender: "f" },
    { id: "sunny_m", label: "陽光男聲", pitch: 1.15, rate: 1.08, gender: "m" },

  const FEMALE_RE = /kyoko|o-?ren|haruka|nanami|ayumi|sayaka|mizuki|hana|kanade|female|woman|women|女/i;

  /* ---------- 語音（無 speechSynthesis 時靜音降級，絕不拋錯） ---------- */
  const TTS = (function () {
    let ok = false;

    const cfg = { voiceURI: "", pitch: 1.0, rate: 0.85, gender: "" };
    let voice = null;
    function jaVoices() {
      try { return (window.speechSynthesis.getVoices() || []).filter(v => /^ja/i.test(v.lang)); }
      catch (e) { return []; }
    }

      const vs = jaVoices();
      if (!vs.length) { voice = null; return; }
      // 1) 使用者手選的語音優先
      if (cfg.voiceURI) { const hit = vs.find(v => v.voiceURI === cfg.voiceURI); if (hit) { voice = hit; return; } }
      // 2) 依人格性別偏好挑一個相符語音
      if (cfg.gender === "f") { const f = vs.find(v => FEMALE_RE.test(v.name) && !MALE_RE.test(v.name)); if (f) { voice = f; return; } }
      if (cfg.gender === "m") { const m = vs.find(v => MALE_RE.test(v.name) && !FEMALE_RE.test(v.name)); if (m) { voice = m; return; } }

          u.rate = rateOverride || cfg.rate;

  /* 圖片載入優先序：img/{key}.png → 內建 SVG → emoji */
  function visualEl(x) {

    const fallback = () => {

  /* ---------- 工具 ---------- */
  const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  function weightedPick(set, excludeK) {
    let pool = set.filter(x => x.k !== excludeK);

    let total = 0;
    const cum = pool.map(x => (total += (P.weights[x.k] || 1)));
    const r = Math.random() * total;
    for (let i = 0; i < pool.length; i++) if (r < cum[i]) return pool[i];
    return pool[pool.length - 1];
  }
  function kanaSizeClass(k) { return k.length > 1 ? "kana-big multi" : "kana-big"; }
  function unlockedLevels() { return LEVELS.filter(lv => lv.id <= P.unlocked); }
  function unlockedKana() { const out = []; unlockedLevels().forEach(lv => out.push(...lv.hira, ...lv.kata)); return out; }
  // 「已練習」＝該級至少有一個假名被自評或考過（srs.reps > 0）。
  // 剛考完 N 級解鎖 N+1 級、但還沒練過 N+1 級時，隨機考不該把 N+1 級算進去。
  function isLevelStudied(lv) { return lv.hira.concat(lv.kata).some(x => { const s = P.srs[x.k]; return !!(s && s.reps > 0); }); }
  function studiedLevels() {
    const out = unlockedLevels().filter(isLevelStudied);
    return out.length ? out : unlockedLevels().slice(0, 1);   // 全新使用者：至少給第 1 級，避免空池
  }
  function studiedKana() { const out = []; studiedLevels().forEach(lv => out.push(...lv.hira, ...lv.kata)); return out; }
  function rangeKana(loId, hiId, kinds) {   // kinds: "hira" | "kata" | "both"
    const out = [];
    LEVELS.forEach(lv => {
      if (lv.id < loId || lv.id > hiId) return;
      if (kinds !== "kata") out.push(...lv.hira);
      if (kinds !== "hira") out.push(...lv.kata);

  }
  function reviewQueue() {   // 已解鎖範圍內到期複習，依最該複習優先，上限 40（CLT 保護工作記憶）
    const now = Date.now();
    return unlockedKana().filter(x => dueOf(x.k) <= now)
      .sort((a, b) => dueOf(a.k) - dueOf(b.k)).slice(0, 40);
  }

  /* ----- 弱項池（權重 / 忘記次數 / 星號） ----- */
  function forgetCount(k) { const s = P.srs[k]; return s ? (s.lapses || 0) : 0; }
  function isWeak(k) { return (P.weights[k] || 1) > 1 || !!P.star[k] || forgetCount(k) > 0; }
  function weakScore(k) { return (P.star[k] ? 1000 : 0) + (P.weights[k] || 1) * 100 + forgetCount(k) * 10; }
  function weakPool() { return unlockedKana().filter(x => isWeak(x.k)).sort((a, b) => weakScore(b.k) - weakScore(a.k)); }

  /* ----- 學習強度：今日計畫（App 內提醒） ----- */
  function planReset() {
    const t = dayKey(Date.now());
    if (P.plan.progress.date !== t) { P.plan.progress = { date: t, level: 0, weak: 0, random: 0, write: 0 }; save(); }
  }
  function bumpPlan(kind) { planReset(); if (kind && kind in P.plan.progress) { P.plan.progress[kind]++; save(); } }
  function planTasks() {
    planReset();
    const cfg = INTENSITY[P.plan.intensity] || INTENSITY.normal;
    const epochDay = Math.floor(Date.parse(P.plan.progress.date) / DAY);
    const levelDay = (epochDay % cfg.levelEveryNDays) === 0;
    const pr = P.plan.progress;
    const tasks = [];
    if (levelDay) tasks.push({ kind: "level", label: "練習 " + cfg.levelsPerDay + " 級", need: cfg.levelsPerDay, done: pr.level });
    const weakNeed = cfg.weakDaily === true ? 1 : (cfg.weakDaily === "alt" ? (levelDay ? 0 : 1) : 0);
    if (weakNeed) tasks.push({ kind: "weak", label: "弱項鍛鍊", need: weakNeed, done: pr.weak });
    let rnd = cfg.randomPerDay;
    if (P.plan.intensity === "casual" && !P.plan.casualRandom) rnd = 0;
    if (rnd) tasks.push({ kind: "random", label: "每日隨機考" + (rnd > 1 ? " ×" + rnd : ""), need: rnd, done: pr.random });
    return tasks;
  }
  function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }

  /* ----- 易混淆假名（Noticing the Gap）：程式資產，非題庫 ----- */
  const CONFUSE_GROUPS = [
    ["シ", "ツ", "ソ", "ン"], ["ね", "れ", "わ"], ["は", "ほ", "ま", "も"], ["る", "ろ"],
    ["ク", "ワ", "タ", "ケ", "フ"], ["コ", "ユ", "ヨ"], ["ぬ", "め", "れ"], ["あ", "お"],
    ["き", "さ", "ち"], ["ウ", "ワ", "ヲ", "ラ"], ["ナ", "メ", "ヌ", "ス"], ["ア", "マ"]
  ];
  const CONFUSABLES = {};
  CONFUSE_GROUPS.forEach(g => g.forEach(k => { CONFUSABLES[k] = (CONFUSABLES[k] || []).concat(g.filter(o => o !== k)); }));
  function confusablePool(pool, correctK) {   // pool 中與正解形近者，供考試優先干擾
    const set = CONFUSABLES[correctK]; if (!set) return null;
    const hit = pool.filter(o => set.indexOf(o.k) >= 0);
    return hit.length ? hit : null;
  }
  function distractors(pool, correct, n, key, priorityPool) {
    const c = key(correct);
    let cand = priorityPool ? shuffle([...new Set(priorityPool.map(key))].filter(v => v !== c)) : [];
    const rest = shuffle([...new Set(pool.map(key))].filter(v => v !== c && cand.indexOf(v) < 0));
    cand = cand.concat(rest).slice(0, n);
    return shuffle(cand.concat([c]));
  }

  /* ----- 羅馬音容錯比對（產出型輸入）：hepburn 標準 + 常見替代拼法 ----- */
  const ROMAJI_ALIASES = {
    si: "shi", ti: "chi", tu: "tsu", hu: "fu", zi: "ji", di: "ji", du: "zu",
    sya: "sha", syu: "shu", syo: "sho", tya: "cha", tyu: "chu", tyo: "cho",
    zya: "ja", zyu: "ju", zyo: "jo", jya: "ja", jyu: "ju", jyo: "jo"
  };
  function romajiEq(input, answer) {
    const v = String(input || "").trim().toLowerCase().replace(/[^a-z]/g, "");
    return !!v && (v === answer || ROMAJI_ALIASES[v] === answer);
  }

  /* ----- 課後總結 ----- */

    return '<div class="summary">' +
      '<div class="srow"><span>正確率</span><b>' + acc + "%</b></div>" +
      '<div class="srow"><span>用時</span><b>' + secs + " 秒</b></div>" +
      (weak.length ? '<div class="srow"><span>最弱</span><b>' + weak.map(esc).join("　") + "</b></div>" : "") +
      '<div class="srow"><span>連續</span><b>🔥 ' + (P.daily.streakDays || 0) + " 天</b></div>" +
      '<div class="srow"><span>目標</span><b>' + goalTxt + "</b></div></div>";
  }

    const rv = $app.querySelector("#review");

    $app.querySelector("#skip").addEventListener("click", go);

      TTS.speak(set[i].k);
      i++;
      timeout = setTimeout(step, 1600);
    })();
  }

  /* =====================  翻牌練習（通用；支援 audioFront 音先於形） ===================== */
  function practiceScreen(cfg) {
    const set = cfg.set;

    if (!set || !set.length) return backTo();
    const total = cfg.total || set.length * (cfg.rounds || 2);
    const audioFront = cfg.audioFront && TTS.enabled;
    let done = 0, lastK = null, hits = 0;

    function head() {
      return '<div class="topbar"><div><h1>' + esc(cfg.title) + "</h1>" +
        '<div class="sub">' + (cfg.sub ? esc(cfg.sub) + " ・ " : "") + "第 " + (done + 1) + " / " + total + ' 張</div></div>' +
        '<button class="ghost small" id="quit">結束</button></div>';

    function nextCard() {

      const front = audioFront
        ? '<button class="shu" id="playf">🔊 播放發音</button><div class="tap-hint">聽發音、回想字形，再點卡揭曉</div>'
        : '<span class="' + kanaSizeClass(x.k) + '">' + esc(x.k) + '</span><div class="tap-hint">先在心裡唸出來，再點卡揭曉</div>';

    function revealCard(x) {

      );

    function practiceDone() {
      if (cfg.planKind) bumpPlan(cfg.planKind);

  /* =====================  考試（60 秒；通用 config） =====================
   * config = { title, set, poolAll, bestKey, onBack, onPass?, allowType? }
   * 題型：聽選 / 讀選 / 平片配對 /（allowType）鍵入羅馬音（產出型）。
   * 選項干擾優先取形近字（Noticing the Gap）。答錯播正確音、餵入權重與 SRS。
   * =================================================================== */
  function examScreen(cfg) {
    const EXAM_SEC = 60;
    const countMode = typeof cfg.qTotal === "number";   // 題數模式（如每日隨機 60 題）；否則 60 秒計時
    const passN = cfg.passN != null ? cfg.passN : 12;
    const set = cfg.set, poolAll = cfg.poolAll;
    const types = [];
    if (TTS.enabled) types.push("listen");        // 無語音剔除聽選
    types.push("read", "match");
    if (cfg.allowType) types.push("type");         // 產出型回憶（Pushed Output）
    const backTo = cfg.onBack || homeScreen;

    let score = 0, answered = 0, remain = EXAM_SEC, lastK = null, locked = false, hits = 0;
    const missed = {}, startTs = Date.now();
    const timeUp = () => !countMode && remain <= 0;
    const finished = () => countMode ? answered >= cfg.qTotal : remain <= 0;

    function makeQuestion() {
      const type = types[Math.floor(Math.random() * types.length)];
      const x = weightedPick(set, lastK);
      lastK = x.k;
      if (type === "read") return { type, x, answer: x.r, options: distractors(poolAll, x, 3, o => o.r) };
      if (type === "type") return { type, x, answer: x.r };
      if (type === "listen") {
        const sameType = poolAll.filter(o => o.type === x.type);
        return { type, x, answer: x.k, options: distractors(sameType, x, 3, o => o.k, confusablePool(sameType, x.k)) };
      }
      // match：平片配對（雙向）
      const oppo = poolAll.filter(o => o.type !== x.type);
      const correct = BY_K[x.pair] || { k: x.pair };
      return { type, x, answer: correct.k, options: distractors(oppo, correct, 3, o => o.k, confusablePool(oppo, correct.k)) };
    }

    function header() {
      const right = countMode
        ? '<div class="progress-note">第 <b>' + Math.min(answered + 1, cfg.qTotal) + "</b> / " + cfg.qTotal + " 題</div>"
        : '<div class="progress-note">剩餘 <b id="sec">' + remain + '</b> 秒</div>';
      const barW = countMode ? (answered / cfg.qTotal * 100) : (remain / EXAM_SEC * 100);
      return '<div class="exam-head"><div class="exam-score">得分 ' + score + " 題</div>" + right +
        '<button class="ghost small" id="quit">放棄</button></div>' +
        '<div class="timerbar"><i id="bar" style="width:' + barW + '%"></i></div>';
    }

    function grade(right, q, btn) {
      if (locked) return;
      locked = true; answered++;
      if (right) { score++; hits++; markHit(q.x.k); if (btn) btn.classList.add("hit"); }
      else {
        markMiss(q.x.k);                 // 答錯餵入權重 + SRS
        missed[q.x.k] = (missed[q.x.k] || 0) + 1;
        TTS.speak(q.x.k);                // 答錯播正確音
        if (btn) btn.classList.add("miss");
        $app.querySelectorAll(".opts button").forEach(b => { if (b.dataset.v === q.answer) b.classList.add("hit"); });
        const tin = $app.querySelector("#tin");
        if (tin) { tin.classList.add("wrong"); tin.value = q.answer; tin.disabled = true; }
      }
      const scoreEl = $app.querySelector(".exam-score");
      if (scoreEl) scoreEl.textContent = "得分 " + score + " 題";
      if (countMode) { const b = $app.querySelector("#bar"); if (b) b.style.width = (answered / cfg.qTotal * 100) + "%"; }
      setTimeout(() => { if (finished()) finish(); else showQuestion(); }, right ? 350 : 950);
    }

    function showQuestion() {
      if (finished()) return finish();
      locked = false;
      const q = makeQuestion();
      const kCls = q.x.k.length > 1 ? "k multi" : "k";
      let promptHtml;
      if (q.type === "listen") {
        promptHtml = '<div class="label">聽發音，選出正確的假名</div><button class="shu" id="playq">🔊 播放發音</button>';
      } else if (q.type === "read") {
        promptHtml = '<div class="label">這個假名的羅馬音是？</div><div class="' + kCls + '">' + esc(q.x.k) + "</div>";
      } else if (q.type === "type") {
        promptHtml = '<div class="label">鍵入這個假名的羅馬音</div><div class="' + kCls + '">' + esc(q.x.k) + "</div>";
      } else {
        promptHtml = '<div class="label">' + (q.x.type === "hira" ? "選出對應的片假名" : "選出對應的平假名") +
          '</div><div class="' + kCls + '">' + esc(q.x.k) + "</div>";
      }
      const answerHtml = q.type === "type"
        ? '<form class="typebox" id="typef"><input id="tin" type="text" inputmode="latin" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="羅馬音…"><button class="shu" type="submit">送出</button></form>'
        : '<div class="opts">' + q.options.map(o => '<button data-v="' + esc(o) + '">' + esc(o) + "</button>").join("") + "</div>";
      render(header() + '<div class="q-prompt">' + promptHtml + "</div>" + answerHtml);
      startTick();
      $app.querySelector("#quit").addEventListener("click", backTo);
      const pq = $app.querySelector("#playq");
      if (pq) { pq.addEventListener("click", () => TTS.speak(q.x.k)); TTS.speak(q.x.k); }
      if (q.type === "type") {
        const inp = $app.querySelector("#tin");
        inp.focus();
        $app.querySelector("#typef").addEventListener("submit", e => { e.preventDefault(); grade(romajiEq(inp.value, q.answer), q, null); });
      } else {
        $app.querySelectorAll(".opts button").forEach(btn =>
          btn.addEventListener("click", () => grade(btn.dataset.v === q.answer, q, btn)));
      }
    }

    function startTick() {
      if (countMode || examTimer) return;   // 題數模式不計時
      examTimer = setInterval(() => {
        remain--;
        const s = $app.querySelector("#sec"), b = $app.querySelector("#bar");
        if (s) s.textContent = remain;
        if (b) b.style.width = (Math.max(0, remain) / EXAM_SEC * 100) + "%";
        if (remain <= 0) { clearInterval(examTimer); examTimer = null; finish(); }
      }, 1000);
    }

    function finish() {
      clearTimers();
      const prevBest = P.best[cfg.bestKey];
      if (prevBest == null || score > prevBest) P.best[cfg.bestKey] = score;
      const passHtml = cfg.onPass ? cfg.onPass(score) : "";
      if (cfg.planKind) bumpPlan(cfg.planKind);
      save();
      const passLine = cfg.onPass
        ? "<br>" + (score >= 12 ? "通過標準（≥ 12 題）！" : "還差 " + (12 - score) + " 題就能解鎖下一級，加油！")
        : (countMode ? "<br>" + (score >= passN ? "🎉 通過！（≥ " + passN + " 題）" : "未達標準（需 ≥ " + passN + " 題），再挑戰一次！") : "");
      render(
        '<div class="result-box"><div class="big">' + score + ' 題</div>' +
        '<div class="msg">' + esc(cfg.title) + " 結束（作答 " + answered + " 題）" + passLine + "</div>" +
        passHtml +
        sessionSummary({ correct: hits, total: answered, missed, startTs }) +
        '<div class="btn-col">' +
        '<button class="shu" id="again">再考一次</button>' +
        '<button class="ghost" id="back">返回</button>' +
        '<button class="ghost" id="home">回首頁</button></div></div>'
      );
      $app.querySelector("#again").addEventListener("click", () => examScreen(cfg));
      $app.querySelector("#back").addEventListener("click", backTo);
      $app.querySelector("#home").addEventListener("click", homeScreen);
    }

    showQuestion();
  }

  // 各級考試 config：題組=當級、干擾池=已解鎖、通過解鎖下一級（行為與原本一致）
  function levelExamCfg(lv) {
    const poolAll = [];
    LEVELS.filter(l => l.id <= Math.max(P.unlocked, lv.id)).forEach(l => poolAll.push(...l.hira, ...l.kata));
    return {
      title: lv.name + " 考試", set: lv.hira.concat(lv.kata), poolAll, bestKey: lv.id,
      onBack: () => levelScreen(lv.id),
      onPass: (score) => {
        if (score >= 12) {
          const next = lv.id + 1;
          if (next <= LEVELS.length && P.unlocked < next) { P.unlocked = next; return '<div class="unlock">🎊 已解鎖 ' + esc(LEVELS[next - 1].name) + "！</div>"; }
          if (next > LEVELS.length) return '<div class="unlock">🏆 你已完成全部級別！</div>';
        }
        return "";
      }
    };
  }

  /* =====================  總複習 / 挑戰（跨級交錯） ===================== */
  function challengeSetupScreen() {
    const maxLv = P.unlocked;
    const STAGES = [{ label: "1–5 級", lo: 1, hi: 5 }, { label: "6–10 級", lo: 6, hi: 10 },
      { label: "11–14 級", lo: 11, hi: 14 }, { label: "全部", lo: 1, hi: maxLv }]
      .filter(s => s.lo <= maxLv).map(s => ({ label: s.label, lo: s.lo, hi: Math.min(s.hi, maxLv) }));
    const kindsOpts = [{ label: "平+片", v: "both" }, { label: "只平假", v: "hira" }, { label: "只片假", v: "kata" }];
    const modeOpts = [{ label: "翻牌複習", v: "flash" }, { label: "60 秒挑戰", v: "exam" }];
    let rangeIdx = STAGES.length - 1, kindsIdx = 0, modeIdx = 0, input = false;

    function segHtml(id, opts, cur) {
      return '<div class="seg" data-seg="' + id + '">' + opts.map((o, i) =>
        '<button class="' + (i === cur ? "on" : "") + '" data-i="' + i + '">' + esc(o.label) + "</button>").join("") + "</div>";
    }
    function draw() {
      render(
        '<div class="topbar"><div><h1>總複習 / 挑戰</h1><div class="sub">跨級交錯練習（強化編碼變異）</div></div>' +
        '<button class="ghost small" id="back">← 返回</button></div>' +
        '<div class="setup">' +
        '<div class="setlabel">範圍</div>' + segHtml("range", STAGES, rangeIdx) +
        '<div class="setlabel">假名種類</div>' + segHtml("kinds", kindsOpts, kindsIdx) +
        '<div class="setlabel">模式</div>' + segHtml("mode", modeOpts, modeIdx) +
        (modeOpts[modeIdx].v === "exam"
          ? '<label class="check-row"><input type="checkbox" id="inp"' + (input ? " checked" : "") + ">輸入模式：鍵入羅馬音（產出型回憶，較深編碼）</label>" : "") +
        '<button class="start" id="start" style="margin-top:18px;width:100%">開始</button></div>'
      );
      $app.querySelector("#back").addEventListener("click", homeScreen);
      $app.querySelectorAll('[data-seg="range"] button').forEach(b => b.addEventListener("click", () => { rangeIdx = +b.dataset.i; draw(); }));
      $app.querySelectorAll('[data-seg="kinds"] button').forEach(b => b.addEventListener("click", () => { kindsIdx = +b.dataset.i; draw(); }));
      $app.querySelectorAll('[data-seg="mode"] button').forEach(b => b.addEventListener("click", () => { modeIdx = +b.dataset.i; draw(); }));
      const inp = $app.querySelector("#inp"); if (inp) inp.addEventListener("change", e => { input = e.target.checked; });
      $app.querySelector("#start").addEventListener("click", start);
    }
    function start() {
      const rg = STAGES[rangeIdx], kinds = kindsOpts[kindsIdx].v, mode = modeOpts[modeIdx].v;
      const set = rangeKana(rg.lo, rg.hi, kinds);
      if (!set.length) return;
      const title = "挑戰 " + rg.label;
      if (mode === "flash") return practiceScreen({ title, sub: kindsOpts[kindsIdx].label, set, onBack: challengeSetupScreen, rounds: 1 });
      examScreen({ title, set, poolAll: rangeKana(rg.lo, rg.hi, "both"),
        bestKey: "challenge:" + rg.lo + "-" + rg.hi + ":" + kinds + (input ? ":type" : ""),
        onBack: challengeSetupScreen, allowType: input });
    }
    draw();
  }

    const pool = unlockedKana();

    examScreen({ title: "易混淆特訓", set, poolAll: pool, bestKey: "confuse", onBack: homeScreen });

  /* =====================  每日隨機考（已練習級別隨機 60 題，≥45 及格） ===================== */
  function randomExamLevelLabel() {
    const ids = studiedLevels().map(lv => lv.id);
    if (ids.length === 1) return "第 " + ids[0] + " 級";
    const contiguous = ids[ids.length - 1] - ids[0] + 1 === ids.length;   // 跳級練習時可能不連續
    return contiguous ? ids[0] + "–" + ids[ids.length - 1] + " 級" : "已練習 " + ids.length + " 級";
  }
  function dailyRandomExam() {
    const pool = studiedKana();   // 只考已練習過的級別；剛解鎖還沒練的級別不納入
    examScreen({ title: "每日隨機考", set: pool, poolAll: pool, qTotal: 60, passN: 45, bestKey: "daily-random", onBack: homeScreen, planKind: "random" });
  }

  /* =====================  設定中心（學習強度 / 語音 / 辭庫 / 備份還原） ===================== */
  function importSaved(obj) {   // 併入外部存檔（與 boot 相同邏輯）
    if (!obj || typeof obj !== "object" || (!obj.srs && !obj.weights && typeof obj.unlocked !== "number")) return false;
    if (obj.weights) P.weights = obj.weights;
    if (obj.streak) P.streak = obj.streak;
    if (obj.best) P.best = obj.best;
    if (obj.srs) P.srs = obj.srs;
    if (obj.star) P.star = obj.star;
    if (obj.daily) Object.assign(P.daily, obj.daily);
    if (obj.tts) Object.assign(P.tts, obj.tts);
    if (obj.plan) { Object.assign(P.plan, obj.plan); if (obj.plan.progress) Object.assign(P.plan.progress, obj.plan.progress); }
    if (obj.news) Object.assign(P.news, obj.news);
    if (obj.wb && typeof obj.wb === "object") P.wb = obj.wb;
    if (typeof obj.unlocked === "number") P.unlocked = Math.min(Math.max(1, obj.unlocked), LEVELS.length);
    if (typeof obj.warmup === "boolean") P.warmup = obj.warmup;
    initKeys(); TTS.configure(P.tts); save();
    return true;
  }
  function downloadJSON(filename, text) {
    try {
      const url = URL.createObjectURL(new Blob([text], { type: "application/json" }));
      const a = document.createElement("a"); a.href = url; a.download = filename;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000); return true;
    } catch (e) { return false; }
  }

  function settingsScreen() {
    const voices = TTS.voices();
    function applyVoice() { TTS.configure(P.tts); save(); }
    const setNote = (id, msg, err) => { const n = $app.querySelector(id); if (n) { n.textContent = msg; n.className = "note" + (err ? " err" : ""); } };
    // 辭庫管理的區域狀態：只重繪 #wbpanel，不整頁 redraw（設定頁很長，整頁重繪會跳回頂端）
    let wbLv = LEVELS[0].id, wbK = LEVELS[0].hira[0].k, wbEditing = "", wbArmed = false;
    function wbLevelKana(id) { const lv = LEVELS.find(l => l.id === id) || LEVELS[0]; return lv.hira.concat(lv.kata); }
    function drawWb(msg, err) {
      const box = $app.querySelector("#wbpanel"); if (!box) return;
      const kanaList = wbLevelKana(wbLv);
      if (!kanaList.some(x => x.k === wbK)) wbK = kanaList[0].k;

      const ownW = new Set(wbOwn(wbK).map(c => c.w));

      const customLv = ALL_KANA.reduce((n, x) => n + (wbCustomised(x.k) ? 1 : 0), 0);
      const status = msg || ("共 " + list.length + " 詞（內建 " + (list.length - ownN) + " ・ 自訂 " + ownN +
        (hiddenN ? " ・ 已隱藏 " + hiddenN : "") + "）");
      box.innerHTML =
        '<div class="wb-sel">' +
        '<select id="wblv" aria-label="級別">' + LEVELS.map(l =>
          '<option value="' + l.id + '"' + (l.id === wbLv ? " selected" : "") + ">" + esc(l.name) + "</option>").join("") + "</select>" +
        '<select id="wbk" aria-label="假名">' + kanaList.map(x =>
          '<option value="' + esc(x.k) + '"' + (x.k === wbK ? " selected" : "") + ">" + esc(x.k) + "（" + esc(x.r) + "）・" +
          wbList(x.k).length + " 詞" + (wbCustomised(x.k) ? " ✎" : "") + "</option>").join("") + "</select>" +
        "</div>" +
        (list.length
          ? list.map(c =>
              '<div class="wb-row" data-w="' + esc(c.w) + '">' +
              '<span class="ww">' + esc(c.w) + "</span>" +
              '<span class="src ' + (ownW.has(c.w) ? "own\">自訂" : "std\">內建") + "</span>" +
              '<span class="wz">' + esc(c.zh) + "</span>" +
              '<button class="ghost" data-act="say" title="試聽">🔊</button>' +
              '<button class="ghost" data-act="edit" title="編輯">✎</button>' +
              '<button class="ghost" data-act="del" title="' + (ownW.has(c.w) ? "刪除" : "隱藏") + '">✕</button>' +
              "</div>").join("")
          : '<div class="wb-empty">這個音沒有辭庫詞，練習時會退回題庫預設單詞。</div>') +
        '<div class="wb-add">' +
        '<input id="wbw" placeholder="單詞（假名）" autocomplete="off">' +

        '<div class="btn-row">' +

        '<button class="ghost" id="wbresetall"' + (customLv ? "" : " disabled") + ">" +
        (wbArmed ? "⚠︎ 再按一次確定" : "↩︎ 全部還原（" + customLv + " 音）") + "</button></div>";

      $app.querySelector("#wblv").addEventListener("change", e => { wbLv = +e.target.value; wbEditing = ""; drawWb(); });
      $app.querySelector("#wbk").addEventListener("change", e => { wbK = e.target.value; wbEditing = ""; drawWb(); });
      const wIn = $app.querySelector("#wbw"), zIn = $app.querySelector("#wbz");
      if (wbEditing) {
        const cur = list.find(c => c.w === wbEditing);
        if (cur) { wIn.value = cur.w; zIn.value = cur.zh; }
      }
      $app.querySelectorAll(".wb-row").forEach(row => row.querySelectorAll("button").forEach(b =>
        b.addEventListener("click", () => {
          const w = row.dataset.w;
          wbArmed = false;
          if (b.dataset.act === "say") return TTS.speak(w);
          if (b.dataset.act === "edit") { wbEditing = w; return drawWb("改好後按 ✓ 儲存（內建詞會轉為自訂詞，隨時可還原）。"); }
          const wasOwn = ownW.has(w);
          wbRemove(wbK, w); wbEditing = "";
          drawWb((wasOwn ? "已刪除自訂詞「" : "已隱藏內建詞「") + w + "」。");
        })));
      function keepDraw(m, w, zh) {   // 驗證失敗：重繪後把使用者打的字填回去
        drawWb(m, true);
        const a = $app.querySelector("#wbw"), b2 = $app.querySelector("#wbz");

          '<button class="' + (curP === "custom" ? "on" : "") + '" data-id="custom">自訂</button>' +

        setNote("#bknote", ok ? "已匯出 JSON 檔。" : "此環境無法下載，請改用「複製」。", !ok);

  /* =====================  書寫練習（田字格 canvas 描寫；無辨識） ===================== */
  function writeScreen() {
    const set = unlockedKana();
    if (!set.length) return homeScreen();
    let i = 0, counted = false;
    function show() {
      if (i >= set.length) { render('<div class="result-box"><div class="big">✍️</div><div class="msg">書寫練習完成！</div>' +
        '<div class="btn-col"><button id="again">再寫一輪</button><button class="ghost" id="back">回首頁</button></div></div>');
        $app.querySelector("#again").addEventListener("click", () => { i = 0; counted = false; show(); });
        $app.querySelector("#back").addEventListener("click", homeScreen); return; }
      const x = set[i];
      render(
        '<div class="topbar"><div><h1>書寫練習</h1><div class="sub">田字格描寫 ・ ' + (i + 1) + " / " + set.length + "</div></div>" +
        '<button class="ghost small" id="quit">結束</button></div>' +
        '<div class="write-info"><span class="wk">' + esc(x.k) + '</span><span class="wr">' + esc(x.r) + "</span>" +
        (TTS.enabled ? '<button class="ghost small" id="wplay">🔊</button>' : "") + "</div>" +
        '<div class="write-stage"><canvas id="pad" width="320" height="320"></canvas></div>' +
        '<div class="grade-btns"><button class="shu" id="clear">清除</button><button id="next">完成 →</button></div>'
      );
      $app.querySelector("#quit").addEventListener("click", homeScreen);
      const wp = $app.querySelector("#wplay"); if (wp) wp.addEventListener("click", () => TTS.speak(x.k));
      TTS.speak(x.k);
      const cv = $app.querySelector("#pad"), ctx = cv.getContext("2d");
      function paintGuide() {
        ctx.clearRect(0, 0, cv.width, cv.height);
        // 田字格
        ctx.strokeStyle = "#e0dccf"; ctx.lineWidth = 1;
        ctx.strokeRect(6, 6, cv.width - 12, cv.height - 12);
        ctx.save(); ctx.setLineDash([8, 8]); ctx.strokeStyle = "#c9d4e6";
        ctx.beginPath(); ctx.moveTo(cv.width / 2, 8); ctx.lineTo(cv.width / 2, cv.height - 8);
        ctx.moveTo(8, cv.height / 2); ctx.lineTo(cv.width - 8, cv.height / 2); ctx.stroke(); ctx.restore();
        // 描紅字（淡）
        ctx.fillStyle = "#eadfae"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
        ctx.font = (x.k.length > 1 ? 170 : 230) + 'px "Hiragino Sans","Noto Sans JP",sans-serif';
        ctx.fillText(x.k, cv.width / 2, cv.height / 2 + 10);
      }
      paintGuide();
      ctx.lineCap = "round"; ctx.lineJoin = "round";
      let drawing = false;
      const pos = e => { const r = cv.getBoundingClientRect(); const p = e.touches ? e.touches[0] : e; return { x: (p.clientX - r.left) * cv.width / r.width, y: (p.clientY - r.top) * cv.height / r.height }; };
      const start = e => { e.preventDefault(); drawing = true; const p = pos(e); ctx.strokeStyle = "#1f4788"; ctx.lineWidth = 12; ctx.beginPath(); ctx.moveTo(p.x, p.y); };
      const move = e => { if (!drawing) return; e.preventDefault(); const p = pos(e); ctx.lineTo(p.x, p.y); ctx.stroke(); };
      const end = () => { drawing = false; };
      cv.addEventListener("pointerdown", start); cv.addEventListener("pointermove", move);
      window.addEventListener("pointerup", end);
      $app.querySelector("#clear").addEventListener("click", paintGuide);
      $app.querySelector("#next").addEventListener("click", () => { if (!counted) { bumpPlan("write"); counted = true; } i++; show(); });
    }
    show();
  }

  function speakUnlocked(pack) { return inputMastered(pack) || levelRank(pack.level) >= 3; }  // N3+ 或輸入達標

      const promptHtml = q.type === "listening"
        ? '<div class="label">' + esc(q.prompt.zh) + '</div><button class="shu" id="playq">🔊 播放發音</button>'
        : '<div class="label">' + esc(q.prompt.zh) + "</div>" + (q.prompt.ja ? '<div class="k" style="font-size:1.4rem">' + esc(q.prompt.ja) + "</div>" : "");
      render(
        '<div class="exam-head"><div class="exam-score">得分 ' + score + " / " + qs.length + "</div>" +
        '<div class="progress-note">第 ' + (i + 1) + " / " + qs.length + " 題</div>" +
        '<button class="ghost small" id="quit">放棄</button></div>' +
        '<div class="q-prompt">' + promptHtml + "</div>" +
        '<div class="opts">' + q.options.map((o, oi) => '<button data-oi="' + oi + '">' + esc(o) + "</button>").join("") + "</div>" +
        '<div id="qexplain"></div>'
      );
      $app.querySelector("#quit").addEventListener("click", () => newsScreen(pack));
      const pq = $app.querySelector("#playq");
      if (pq) { pq.addEventListener("click", () => TTS.speak(q.audioText)); TTS.speak(q.audioText); }
      $app.querySelectorAll(".opts button").forEach(b => b.addEventListener("click", () => {
        if (locked) return; locked = true;
        const pick = +b.dataset.oi, right = pick === q.answer;
        if (right) { score++; b.classList.add("hit"); }
        else { b.classList.add("miss"); $app.querySelectorAll(".opts button").forEach((x, xi) => { if (xi === q.answer) x.classList.add("hit"); }); }
        $app.querySelector(".exam-score").textContent = "得分 " + score + " / " + qs.length;
        $app.querySelector("#qexplain").innerHTML =
          '<div class="summary"><div class="srow"><span>' + (right ? "✅ 答對" : "❌ 答錯") + "</span></div>" +
          '<div class="srow"><span>解說</span><b>' + esc(q.explain.zh) + "</b></div></div>" +
          '<div class="grade-btns"><button id="next">' + (i + 1 >= qs.length ? "看結果" : "下一題 →") + "</button></div>";
        $app.querySelector("#next").addEventListener("click", () => { i++; show(); });
      }));
    }
    function finish() {
      const pass = score >= 3;
      const prev = P.news.quizBest[pack.date];
      if (prev == null || score > prev) P.news.quizBest[pack.date] = score;
      if (pass) markInput(pack, "quizPassed"); else save();
      render(
        '<div class="result-box"><div class="big">' + score + " / 5</div>" +
        '<div class="msg">' + (pass ? "🎉 通過！（≥ 3 題）" + (speakUnlocked(pack) ? "<br>口說「脫稿」已解鎖。" : "") : "未達 3 題，再試一次！") + "</div>" +
        '<div class="btn-col"><button class="shu" id="again">再考一次</button><button class="ghost" id="back">回新聞</button></div></div>'
      );
      $app.querySelector("#again").addEventListener("click", () => newsQuiz(pack));
      $app.querySelector("#back").addEventListener("click", () => newsScreen(pack));
    }
    show();
  }

  function newsSpeak(pack) {
    const lines = pack.speaking;
    const STEPS = ["音韻浸潤", "語音標記", "視讀哼唱", "盲聽節奏", "語意融合", "錄音診斷", "脫稿演繹"];
    const HINT = ["整段聽 2–3 次，只感受語調與節奏（不看字）。", "看著文字與標記，注意連音／弱化／停頓。",
      "看著文字小聲哼跟。", "不看字，像影子一樣緊跟原聲的節奏。", "一邊跟讀一邊想著中文意思。",
      "錄下自己朗讀，跟原聲比對，自評語調與停頓。", "關掉原聲，只看中文提示，憑記憶說出來。"];
    let step = 1, rec = null, chunks = [], mediaURL = null;
    const playAll = () => { const t = lines.map(l => l.ja).join("。"); TTS.speak(t); };
    function draw() {
      const s = STEPS[step - 1], hint = HINT[step - 1];
      const showText = step === 2 || step === 3 || step === 5;
      const bodyLines = lines.map(l =>
        '<div class="sp-line"><div class="n-ja">' + esc(l.ja) + "</div>" +
        (P.news.furigana ? '<div class="n-furi">' + esc(l.furigana) + "</div>" : "") +
        (step === 2 && l.linking ? '<div class="n-link">🔎 ' + esc(l.linking) + "</div>" : "") +
        (step === 5 ? '<div class="n-zh">' + esc(l.zh) + "</div>" : "") + "</div>").join("");
      const zhHints = lines.map(l => '<div class="n-zh">・' + esc(l.zh) + "</div>").join("");
      let mid;
      if (step === 6) {
        mid = '<div class="rec-box"><button class="shu" id="playorig">🔊 播放原聲</button>' +
          '<button id="recbtn">● 開始錄音</button><audio id="myaudio" controls style="display:none;width:100%;margin-top:10px"></audio>' +
          '<div class="progress-note" id="recnote"></div></div>';
      } else if (step === 7 && !speakUnlocked(pack)) {
        mid = '<div class="banner">🔒 脫稿演繹尚未解鎖。先完成 <b>聽力＋聽寫＋小考(≥3)</b>，或程度達 N3 以上。目前先做前面的步驟即可。</div>';
      } else if (step === 7) {
        mid = '<div class="sp-body">' + zhHints + '<button class="ghost small replay-btn" id="peek" style="margin-top:10px">👁️ 看一眼日文</button></div>';
      } else {
        mid = '<div class="sp-body">' + (showText ? bodyLines : '<div class="progress-note">（此步不看字，專心聽/跟）</div>') +
          '<button class="shu replay-btn" id="playall" style="margin-top:12px">🔊 播放</button></div>';
      }
      render(
        '<div class="topbar"><div><h1>🗣️ 口說七步</h1><div class="sub">第 ' + step + " / 7 步 ・ " + esc(s) + "</div></div>" +
        '<button class="ghost small" id="quit">結束</button></div>' +
        '<div class="stepper">' + STEPS.map((_, k) => '<span class="' + (k + 1 === step ? "now" : (k + 1 < step ? "past" : "")) + '"></span>').join("") + "</div>" +
        '<div class="banner">' + esc(hint) + "</div>" + mid +
        '<div class="grade-btns">' + (step > 1 ? '<button class="ghost" id="prev">← 上一步</button>' : "") +
        '<button id="next">' + (step >= 7 ? "完成" : "下一步 →") + "</button></div>"
      );
      $app.querySelector("#quit").addEventListener("click", () => { stopRec(); newsScreen(pack); });
      const pa = $app.querySelector("#playall"); if (pa) { pa.addEventListener("click", playAll); if (step === 1 || step === 4) playAll(); }
      const po = $app.querySelector("#playorig"); if (po) po.addEventListener("click", playAll);
      const pk = $app.querySelector("#peek"); if (pk) pk.addEventListener("click", () => alert(lines.map(l => l.ja).join("\n")));
      const rb = $app.querySelector("#recbtn"); if (rb) rb.addEventListener("click", toggleRec);
      const pv = $app.querySelector("#prev"); if (pv) pv.addEventListener("click", () => { stopRec(); step--; draw(); });
      $app.querySelector("#next").addEventListener("click", () => { stopRec(); if (step >= 7) return newsScreen(pack); step++; draw(); });
    }
    function stopRec() { try { if (rec && rec.state === "recording") rec.stop(); } catch (e) {} rec = null; }
    function toggleRec() {
      const note = $app.querySelector("#recnote"), btn = $app.querySelector("#recbtn");
      if (rec && rec.state === "recording") { rec.stop(); return; }
      if (!navigator.mediaDevices || !window.MediaRecorder) { note.textContent = "此裝置無法錄音；可改為自己聽原聲、跟著唸並自評。"; return; }
      navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
        chunks = []; rec = new MediaRecorder(stream);
        rec.ondataavailable = e => chunks.push(e.data);
        rec.onstop = () => {
          try { stream.getTracks().forEach(t => t.stop()); } catch (e) {}
          const url = URL.createObjectURL(new Blob(chunks, { type: "audio/webm" }));
          if (mediaURL) URL.revokeObjectURL(mediaURL); mediaURL = url;
          const au = $app.querySelector("#myaudio"); if (au) { au.src = url; au.style.display = "block"; }
          if (btn) btn.textContent = "● 重新錄音"; if (note) note.textContent = "錄好了！播放上方自錄，與原聲比對。";
        };
        rec.start(); if (btn) btn.textContent = "■ 停止錄音"; if (note) note.textContent = "錄音中…唸完再按停止。";
      }).catch(() => { note.textContent = "無法取得麥克風權限；可改為聽原聲、跟著唸並自評。"; });
    }
    draw();
  }

  /* =====================  啟動  ===================== */
  (async function boot() {
    try {
      const saved = await store.get();
      if (saved && typeof saved === "object") {
        Object.assign(P.weights, saved.weights || {});
        Object.assign(P.streak, saved.streak || {});
        Object.assign(P.best, saved.best || {});
        if (saved.srs) Object.assign(P.srs, saved.srs);
        if (saved.daily) Object.assign(P.daily, saved.daily);
        if (typeof saved.unlocked === "number") P.unlocked = saved.unlocked;
        P.warmup = !!saved.warmup;
        if (saved.tts) Object.assign(P.tts, saved.tts);
        if (saved.star) Object.assign(P.star, saved.star);
        if (saved.plan) { Object.assign(P.plan, saved.plan); if (saved.plan.progress) Object.assign(P.plan.progress, saved.plan.progress); }
        if (saved.news) Object.assign(P.news, saved.news);
        if (saved.wb && typeof saved.wb === "object") Object.assign(P.wb, saved.wb);
      }
    } catch (e) {}
    initKeys();
    TTS.configure(P.tts);   // 套用已存語音設定
    if (params.get("unlock") === "all") { P.unlocked = LEVELS.length; }   // 測試後門
    P.unlocked = Math.min(Math.max(1, P.unlocked), LEVELS.length);
    homeScreen();
  })();

  /* ---------- PWA：file:// 開啟時自動略過，不影響運作 ---------- */
  function updateBanner(worker) {
    if (document.querySelector(".updatebar")) return;   // 已經提示過就不重複
    const bar = document.createElement("div");
    bar.className = "updatebar";
    bar.innerHTML = '<span>🆕 有新版本</span><button class="go">立即更新</button><button class="later">稍後</button>';
    bar.querySelector(".go").addEventListener("click", () => {
      bar.querySelector(".go").textContent = "更新中…";
      worker.postMessage({ type: "SKIP_WAITING" });   // 接管後 controllerchange 會觸發重新載入
    });
    bar.querySelector(".later").addEventListener("click", () => bar.remove());
    document.body.appendChild(bar);
  }
  if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)) {
    const hadController = !!navigator.serviceWorker.controller;   // 首次安裝不該提示、也不該自動重整
    let reloading = false;
    navigator.serviceWorker.addEventListener("controllerchange", () => {
      if (!hadController || reloading) return;
      reloading = true; location.reload();
    });
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("sw.js").then(reg => {
        if (reg.waiting && hadController) updateBanner(reg.waiting);   // 上次沒按「立即更新」
        reg.addEventListener("updatefound", () => {
          const sw = reg.installing;
          if (!sw) return;
          sw.addEventListener("statechange", () => {
            if (sw.state === "installed" && navigator.serviceWorker.controller) updateBanner(sw);
          });
        });
        // 長時間開著同一頁的情況：切回前景時再問一次有沒有新版
        document.addEventListener("visibilitychange", () => {
          if (!document.hidden) reg.update().catch(() => {});
        });
      }).catch(() => {});
    });
  }
})();
</script>
